# Journal collection (spec section 8.3).
#
# The journal stanza is a **glob**: one file per execution
# (`editacl_journal_<sid>.log`), with no size-based rotation (D-3). A shared rotating
# handler is not safe across processes, and the journal is the only safety net of an
# irreversible operation.
#
# These stanzas take precedence over the generic monitor of the log directory, which
# guarantees the sourcetype assignment rather than leaving it to automatic detection.
#
# Retention: `_internal` is frozen at 28 days by default. If the operational window of
# the journal must exceed that duration, redefine `index` in `local/inputs.conf` to
# point at a dedicated index with a suitable retention.
#
# THAT IS NOT THE ONLY CONFIGURATION POINT (D-51, section 8.3.bis). This file governs
# INGESTION; reading is governed by the `acl_journal_source` and `acl_diag_source`
# macros of `default/macros.conf`. A redirection applied here and not there leaves
# every shipped search - the monitoring view, the change journal, the rollback macro -
# looking at the old index, and returning an empty result without saying so. Two
# configuration points, each of them single: `local/inputs.conf` and
# `local/macros.conf`.

[monitor://$SPLUNK_HOME/var/log/splunk/editacl_journal*.log]
disabled   = false
index      = _internal
sourcetype = editacl:journal

[monitor://$SPLUNK_HOME/var/log/splunk/editacl.log]
disabled   = false
index      = _internal
sourcetype = editacl:diag

# Application-level journal and diagnostic (v4.2 section 11.1, DV-3). SEPARATE files and
# SEPARATE sourcetypes, for three reasons: `| app_acl_inventory | ... | editappacl` and a
# `| editacl` can coexist in one search and therefore share a `sid`, so a shared file
# name would reopen the line-loss window D-3 closed; a line of one journal carries an
# OBJECT and a line of the other carries a STANZA, so mixing them would have existing
# panels absorb application-level writes into object counters; and the journal format is
# not versioned, so adding keys to an existing sourcetype aggravates a known limit.
#
# The cost is assumed and stated: redirecting the index towards a suitable retention now
# takes FOUR overrides instead of two - `local/inputs.conf` and `local/macros.conf`, for
# each of the two sets.

[monitor://$SPLUNK_HOME/var/log/splunk/editappacl_journal*.log]
disabled   = false
index      = _internal
sourcetype = editappacl:journal

[monitor://$SPLUNK_HOME/var/log/splunk/editappacl.log]
disabled   = false
index      = _internal
sourcetype = editappacl:diag
