# Collecte du journal (§8.3).
#
# La stanza de journal est un **glob** : un fichier par execution
# (`editacl_journal_<sid>.log`), sans rotation par taille (D-3). Un handler rotatif
# partage n'est pas sur entre processus, et le journal est le seul filet de securite
# d'une operation irreversible.
#
# Ces stanzas priment sur le monitor generique du repertoire de logs, ce qui garantit
# l'attribution du sourcetype plutot qu'un apprentissage automatique.
#
# Retention : `_internal` est par defaut gele a 28 jours. Si la fenetre d'exploitation
# du journal doit exceder cette duree, redefinir `index` dans `local/inputs.conf` vers
# un index dedie a retention adaptee. C'est le seul point de configuration a modifier.

[monitor://$SPLUNK_HOME/var/log/splunk/editacl_journal*.log]
disabled   = false
index      = _internal
sourcetype = editacl:journal

[monitor://$SPLUNK_HOME/var/log/splunk/editacl.log]
disabled   = false
index      = _internal
sourcetype = editacl:diag
