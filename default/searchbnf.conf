# Assistant de recherche et coloration syntaxique de `editacl` (§2.3, §4.1).
#
# Sans ce fichier la commande existe — `commands.conf` la declare et splunkd
# l'execute — mais l'interface de recherche l'ignore : le nom n'est pas colorise,
# l'assistant n'affiche ni syntaxe, ni description, ni exemple. Le manque est
# silencieux, aucune erreur n'est levee nulle part.
#
# Deux conditions, et il faut les DEUX. La premiere est ce fichier. La seconde est sa
# VISIBILITE depuis le contexte applicatif ou l'operateur saisit sa recherche — l'app
# `search`, pas `SA-acl-tools` : l'assistant lit `configs/conf-searchbnf` dans le
# namespace de la page. D'ou la stanza `[searchbnf] export = system` de
# `metadata/default.meta`, sans laquelle ce fichier est syntaxiquement valide,
# correctement charge, et sans le moindre effet visible. Mesure en lab : sans l'export,
# `configs/conf-searchbnf` renvoie `total = 0` dans le namespace de la recherche.
#
# `usage = public` est requis : l'assistant de recherche n'opere que sur les commandes
# publiques.
#
# Le nom de stanza `[<commande>-command]` est impose par la plateforme ; il doit
# correspondre a la stanza `[editacl]` de `commands.conf`.
#
# La syntaxe decrite ici est celle du §4.1 du cahier des charges. Toute evolution du
# contrat d'entree de la commande se reporte ici, faute de quoi l'assistant affiche a
# l'operateur une syntaxe qui n'est plus celle du code. `tests/test_app_layout.py`
# verrouille mecaniquement la correspondance entre les options declarees ici et les
# `Option` de `bin/editacl.py`.
#
# Un redemarrage de splunkd est necessaire pour que la plateforme prenne ce fichier en
# compte.

[editacl-command]
syntax = editacl (<editacl-title>)? (<editacl-app>)? (<editacl-id>)? (<editacl-type>)? (<editacl-sharing>)? (<editacl-new-perms-read>)? (<editacl-new-perms-write>)? (<editacl-new-sharing>)? (<editacl-new-owner>)? (<editacl-dryrun>)? (<editacl-validate-roles>)? (<editacl-journal>)? (<editacl-max-objects>)?
shortdesc = Reecrit en masse les ACL des objets de connaissance decrits par le pipeline d'entree, via l'API REST.
description = Chaque parametre NOMME LE CHAMP SPL ou lire une information, et prend \
              pour defaut la nomenclature native ("title", "eai:acl.app", "eai:type", \
              "id", "eai:acl.perms.read", ...). Un pipeline bati sur `acl_inventory` \
              n'a donc besoin d'AUCUN parametre. \p\\
              C'est la PRESENCE DE LA COLONNE dans le jeu de resultats qui decide de \
              modifier ou de preserver : colonne absente, l'attribut est preserve tel \
              que lu ; colonne presente et cellule vide, l'attribut est VIDE ; colonne \
              presente et valuee, la valeur est appliquee. Ni le type de la valeur ni \
              son contenu n'entrent dans cette decision. \p\\
              ATTENTION : la presence est une propriete du JEU DE RESULTATS, pas de \
              l'evenement. Un pipeline qui ne valorise un champ que pour une partie de \
              ses lignes VIDERAIT l'attribut sur les autres. \p\\
              Deux attributs ne se vident pas : "sharing" et "owner" n'ont pas de \
              valeur vide cote plateforme, et une cellule vide y REJETTE l'evenement. \p\\
              Elle est en SIMULATION par defaut : sans "dryrun=false" aucune ecriture \
              n'est emise, les objets ressortent en "dryrun" et rien n'est modifie. La \
              simulation porte toujours sur TOUT le lot, le plafond n'y mordant jamais. \p\\
              L'adressage se fait par un contexte fixe : aucun parametre ne designe un \
              proprietaire d'adresse, et les objets prives sortent en \
              "skipped_private". \p\\
              Chaque ecriture reelle est precedee d'une ligne de journal ecrite et \
              synchronisee sur disque, ce qui rend l'operation reversible par les \
              macros de restauration. Les objets deja conformes ressortent en "noop", \
              y compris en simulation. \i\\
              Requiert la capability "edit_acl_bulk".
usage = public
category = results::write
tags = acl permission permissions role roles sharing owner droits partage
related = rest
example1 = | `acl_inventory` | search "eai:acl.perms.write"="ancien_role" | eval "eai:acl.perms.write"="nouveau_role_admin" | editacl
comment1 = Simulation, sur l'inventaire complet : montre ce que produirait la substitution du role obsolete, sans rien ecrire. Aucun parametre n'est necessaire, la macro emettant la nomenclature native. C'est le comportement par defaut.
example2 = | `acl_inventory(savedsearch,views)` | search "eai:acl.perms.write"="ancien_role" | eval "eai:acl.perms.write"="nouveau_role_admin" | editacl dryrun=false max_objects=2000
comment2 = Ecriture reelle, restreinte aux recherches sauvegardees et aux vues. "dryrun=false" est la seule chose qui distingue une simulation d'une modification ; "max_objects" doit etre releve au-dela de dix objets ecrits.
example3 = | `acl_inventory(savedsearch)` | rename "eai:acl.perms.write" AS write, "eai:type" AS object_type | editacl type=object_type new_perms_write=write
comment3 = Champs renommes par le pipeline amont : chaque parametre redirige la lecture d'une information vers un autre nom de colonne.
example4 = | `editacl_rollback_apply(1754483000.1)`
comment4 = Retour arriere complet d'une execution a partir de son journal indexe, designee par son "sid". La macro porte l'invocation, le proprietaire anterieur compris.

[editacl-title]
syntax = title=<field>
description = Champ portant le NOM de l'objet, dernier segment du chemin REST. Requis \
              en valeur : le champ designe doit exister et porter une valeur.
default = "title=title"

[editacl-app]
syntax = app=<field>
description = Champ portant l'APPLICATION du namespace. Requis en valeur. Un objet en \
              application "system" est rejete.
default = "app=eai:acl.app"

[editacl-id]
syntax = id=<field>
description = Champ portant l'URI COMPLETE de l'objet, voie de resolution primaire de \
              l'endpoint. Un "id" emis par "admin/directory" est ecarte au profit de \
              la table de correspondance.
default = "id=id"

[editacl-type]
syntax = type=<field>
description = Champ portant le TYPE d'objet, resolu par la table de correspondance. \
              Au moins l'une des deux voies, "id" ou "type", doit etre exploitable.
default = "type=eai:type"

[editacl-sharing]
syntax = sharing=<field>
description = Champ portant la portee COURANTE de l'objet, utilisee pour ecarter les \
              objets prives en "skipped_private". \p\\
              Sans elle, la portee est cherchee dans le namespace porte par "id". Si \
              "id" ne la porte pas non plus, la commande NE PEUT PLUS DISCRIMINER : \
              elle resout par le contexte fixe et atteint donc l'objet PARTAGE de ce \
              nom s'il en existe un, alors que la ligne designait peut-etre un prive \
              homonyme. L'evenement porte alors \
              acl_warning="scope_undetermined". Batir le pipeline sur la macro \
              d'inventaire, qui emet toujours les deux, rend ce cas inatteignable.
default = "sharing=eai:acl.sharing"

[editacl-new-perms-read]
syntax = new_perms_read=<field>
description = Champ portant la valeur CIBLE de "perms.read". Colonne absente du jeu de \
              resultats : l'attribut est preserve. Colonne presente et cellule vide : \
              l'attribut est vide.
default = "new_perms_read=eai:acl.perms.read"

[editacl-new-perms-write]
syntax = new_perms_write=<field>
description = Champ portant la valeur CIBLE de "perms.write". Meme semantique de \
              presence que "new_perms_read" : c'est ainsi qu'un "mvmap" retirant la \
              derniere valeur vide effectivement l'attribut.
default = "new_perms_write=eai:acl.perms.write"

[editacl-new-sharing]
syntax = new_sharing=<field>
description = Champ portant la valeur CIBLE de "sharing", parmi "user", "app" et \
              "global". Une cellule VIDE ou hors de ces trois valeurs REJETTE \
              l'evenement : une portee vide n'existe pas cote plateforme.
default = "new_sharing=eai:acl.sharing"

[editacl-new-owner]
syntax = new_owner=<field>
description = Champ portant la valeur CIBLE de "owner". Une cellule VIDE rejette \
              l'evenement, symetriquement a "new_sharing". Ce parametre ne sert PAS a \
              l'adressage, qui se fait par un contexte fixe : il decrit une reprise de \
              propriete, laquelle requiert "admin_all_objects" et un proprietaire cible \
              existant.
default = "new_owner=eai:acl.owner"

[editacl-dryrun]
syntax = dryrun=<bool>
description = Simulation. Vrai par defaut : aucune ecriture n'est emise, le GET est \
              effectue, la fusion calculee, le resultat emis et journalise. \
              "dryrun=false" est necessaire pour modifier reellement les objets.
default = "dryrun=true"

[editacl-validate-roles]
syntax = validate_roles=<bool>
description = Controle de l'existence des roles AJOUTES avant ecriture. Un role \
              inconnu deja present sur l'objet et non modifie par l'operation ne \
              bloque pas ; il est signale par "acl_warning".
default = "validate_roles=true"

[editacl-journal]
syntax = journal=<bool>
description = Consignation dans le journal indexe, deux lignes par ecriture, sur \
              lequel s'appuient les macros de restauration. Le desactiver prive \
              l'execution de tout retour arriere.
default = "journal=true"

[editacl-max-objects]
syntax = max_objects=<int>
description = Nombre maximal d'objets ECRITS par execution. C'est un compteur \
              d'ecritures, pas une pre-condition sur le lot : les statuts sans POST \
              n'y entrent pas, et la SIMULATION N'Y ENTRE JAMAIS — un "dryrun" porte \
              toujours sur tout le lot. \p\\
              A l'atteinte du plafond la commande CESSE D'ECRIRE SANS INTERROMPRE la \
              recherche : les objets suivants ressortent en "skipped_ceiling", la \
              sortie reste complete, le job n'est pas marque en echec, et un \
              avertissement unique dit combien d'objets ont ete ecartes. Relancer la \
              meme recherche avec un plafond superieur termine le lot : les objets \
              deja ecrits ressortent "noop" par idempotence.
default = "max_objects=10"
