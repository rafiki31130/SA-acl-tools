# Search assistant and syntax highlighting for `editacl` (spec sections 2.3 and 4.1).
#
# Without this file the command exists, since `commands.conf` declares it and splunkd
# executes it, but the search interface ignores it: the name is not colored, and the
# assistant shows neither syntax, nor description, nor example. The gap is silent, and
# no error is raised anywhere.
#
# Two conditions, and BOTH are needed. The first one is this file. The second one is
# its VISIBILITY from the application context where the operator types the search,
# that is the `search` app, not `SA-acl-tools`: the assistant reads
# `configs/conf-searchbnf` in the namespace of the page. Hence the
# `[searchbnf] export = system` stanza of `metadata/default.meta`, without which this
# file is syntactically valid, correctly loaded, and without the slightest visible
# effect. Measured on the reference platform: without the export,
# `configs/conf-searchbnf` returns `total = 0` in the namespace of the search.
#
# `usage = public` is required: the search assistant only operates on public commands.
#
# The stanza name `[<command>-command]` is imposed by the platform; it must match the
# `[editacl]` stanza of `commands.conf`.
#
# The syntax described here is the one of section 4.1 of the specification. Any change
# to the input contract of the command must be carried over here, failing which the
# assistant shows the operator a syntax that is no longer the one of the code.
# `tests/test_app_layout.py` mechanically locks the correspondence between the options
# declared here and the `Option` declarations of `bin/editacl.py`.
#
# A restart of splunkd is needed for the platform to take this file into account.

[editacl-command]
syntax = editacl (<editacl-title>)? (<editacl-app>)? (<editacl-id>)? (<editacl-type>)? (<editacl-sharing>)? (<editacl-new-perms-read>)? (<editacl-new-perms-write>)? (<editacl-new-sharing>)? (<editacl-new-owner>)? (<editacl-dryrun>)? (<editacl-validate-roles>)? (<editacl-journal>)? (<editacl-max-objects>)?
shortdesc = Bulk-rewrites the ACLs of the knowledge objects described by the input pipeline, through the REST API.
description = Each parameter NAMES THE SPL FIELD from which to read one piece of \
              information, and defaults to the platform's native field names \
              ("title", "eai:acl.app", "eai:type", "id", "eai:acl.perms.read", ...). \
              A pipeline built on `acl_inventory` therefore needs NO parameter at \
              all. \p\\
              It is the PRESENCE OF THE COLUMN in the result set that decides between \
              modifying and preserving: column absent, the attribute is preserved as \
              read; column present and cell empty, the attribute is EMPTIED; column \
              present and valued, the value is applied. Neither the type of the value \
              nor its content enters into that decision. \p\\
              WARNING: presence is a property of the RESULT SET, not of the event. A \
              pipeline that populates a field for only some of its rows WOULD EMPTY \
              the attribute on the others. \p\\
              Two attributes cannot be emptied: "sharing" and "owner" have no empty \
              value on the platform side, and an empty cell there REJECTS the \
              event. \p\\
              It is in SIMULATION by default: without "dryrun=false" no write is \
              issued, the objects come out as "dryrun" and nothing is modified. The \
              simulation always covers the WHOLE batch, the ceiling never biting on it. \p\\
              Addressing is done through a fixed context: no parameter designates an \
              addressing owner, and private objects come out as \
              "skipped_private". \p\\
              Every real write is preceded by a journal line written and synchronized \
              to disk, which makes the operation reversible through the rollback \
              macros. Objects that are already compliant come out as "noop", \
              including in simulation. \p\\
              ORDER OF USE, and it is not a preference: an object this command writes \
              carries its OWN metadata stanza from then on, that stanza CANNOT BE \
              REMOVED by any measured REST path, and the object therefore stops \
              inheriting the generic permissions of its application FOR GOOD. Govern \
              the generic stanzas FIRST with "editappacl", and keep this command for \
              the exceptions. \i\\
              Requires the "edit_acl_bulk" capability.
usage = public
category = results::write
tags = acl permission permissions role roles sharing owner rights share
related = rest editappacl
example1 = | `acl_inventory` | search "eai:acl.perms.write"="legacy_role" | eval "eai:acl.perms.write"="new_role_admin" | editacl
comment1 = Simulation, over the complete inventory: shows what the substitution of the obsolete role would produce, without writing anything. No parameter is needed, since the macro emits the platform's native field names. This is the default behavior.
example2 = | `acl_inventory(savedsearch,views)` | search "eai:acl.perms.write"="legacy_role" | eval "eai:acl.perms.write"="new_role_admin" | editacl dryrun=false max_objects=2000
comment2 = Real write, restricted to saved searches and views. "dryrun=false" is the only thing that tells a simulation from a modification; "max_objects" must be raised beyond ten written objects.
example3 = | `acl_inventory(savedsearch)` | rename "eai:acl.perms.write" AS write, "eai:type" AS object_type | editacl type=object_type new_perms_write=write
comment3 = Fields renamed by the upstream pipeline: each parameter redirects the reading of one piece of information to a different column name.
example4 = | `editacl_rollback_apply(1754483000.1)`
comment4 = Complete rollback of an execution from its indexed journal, designated by its "sid". The macro carries the invocation, the previous owner included.

[editacl-title]
syntax = title=<field>
description = Field carrying the NAME of the object, last segment of the REST path. \
              Required with a value: the designated field must exist and carry a value.
default = "title=title"

[editacl-app]
syntax = app=<field>
description = Field carrying the APPLICATION of the namespace. Required with a value. \
              An object in the "system" application is rejected.
default = "app=eai:acl.app"

[editacl-id]
syntax = id=<field>
description = Field carrying the COMPLETE URI of the object, primary resolution path \
              for the endpoint. An "id" emitted by "admin/directory" is discarded in \
              favor of the mapping table.
default = "id=id"

[editacl-type]
syntax = type=<field>
description = Field carrying the object TYPE, resolved through the mapping table. At \
              least one of the two paths, "id" or "type", must be usable.
default = "type=eai:type"

[editacl-sharing]
syntax = sharing=<field>
description = Field carrying the CURRENT sharing scope of the object, used to skip \
              private objects as "skipped_private". \p\\
              Without it, the scope is looked for in the namespace carried by "id". \
              If "id" does not carry it either, the command CAN NO LONGER \
              DISCRIMINATE: it resolves through the fixed context and therefore \
              reaches the SHARED object of that name if one exists, whereas the row \
              may have designated a private object of the same name. The event then \
              carries acl_warning="scope_undetermined". Building the pipeline on the \
              inventory macro, which always emits both, makes this case unreachable.
default = "sharing=eai:acl.sharing"

[editacl-new-perms-read]
syntax = new_perms_read=<field>
description = Field carrying the TARGET value of "perms.read". Column absent from the \
              result set: the attribute is preserved. Column present and cell empty: \
              the attribute is emptied.
default = "new_perms_read=eai:acl.perms.read"

[editacl-new-perms-write]
syntax = new_perms_write=<field>
description = Field carrying the TARGET value of "perms.write". Same presence \
              semantics as "new_perms_read": that is how an "mvmap" removing the last \
              value does empty the attribute.
default = "new_perms_write=eai:acl.perms.write"

[editacl-new-sharing]
syntax = new_sharing=<field>
description = Field carrying the TARGET value of "sharing", among "user", "app" and \
              "global". An EMPTY cell, or one outside those three values, REJECTS the \
              event: an empty sharing scope does not exist on the platform side.
default = "new_sharing=eai:acl.sharing"

[editacl-new-owner]
syntax = new_owner=<field>
description = Field carrying the TARGET value of "owner". An EMPTY cell rejects the \
              event, symmetrically to "new_sharing". This parameter is NOT used for \
              addressing, which is done through a fixed context: it describes an \
              ownership takeover, which requires "admin_all_objects" and an existing \
              target owner.
default = "new_owner=eai:acl.owner"

[editacl-dryrun]
syntax = dryrun=<bool>
description = Simulation. True by default: no write is issued, the GET is performed, \
              the merge computed, the outcome emitted and journaled. "dryrun=false" \
              is necessary to actually modify the objects.
default = "dryrun=true"

[editacl-validate-roles]
syntax = validate_roles=<bool>
description = Check that the ADDED roles exist before writing. An unknown role that \
              is already present on the object and is not modified by the operation \
              does not block; it is reported through "acl_warning".
default = "validate_roles=true"

[editacl-journal]
syntax = journal=<bool>
description = Recording in the indexed journal, two lines per write, on which the \
              rollback macros rely. Turning it off deprives the execution of any \
              rollback.
default = "journal=true"

[editacl-max-objects]
syntax = max_objects=<int>
description = Maximum number of objects WRITTEN per execution. It is a write counter, \
              not a pre-condition on the batch: the statuses without a POST do not \
              count toward it, and SIMULATION NEVER COUNTS toward it, a "dryrun" \
              always covering the whole batch. \p\\
              When the ceiling is reached the command STOPS WRITING WITHOUT \
              INTERRUPTING the search: the following objects come out as \
              "skipped_ceiling", the output stays complete, the job is not marked as \
              failed, and a single warning says how many objects were skipped. \
              Running the same search again with a higher ceiling finishes the batch: \
              the objects already written come out as "noop", by idempotence.
default = "max_objects=10"

# ---------------------------------------------------------------------------
# `editappacl` (v4.1 sections 8.1 to 8.5). Same two conditions as above: this file, AND
# its visibility from the app context where the operator types - `[searchbnf] export =
# system` in `metadata/default.meta`, already there and covering this stanza.
#
# The stanza name `[<command>-command]` must match the `[editappacl]` stanza of
# `commands.conf`, and `tests/test_app_layout.py` locks the correspondence between the
# options described here and the `Option` declarations of `bin/editappacl.py`.
# ---------------------------------------------------------------------------

[editappacl-command]
syntax = editappacl (<editappacl-app>)? (<editappacl-stanza-kind>)? (<editappacl-handler>)? (<editappacl-stanza>)? (<editappacl-new-perms-read>)? (<editappacl-new-perms-write>)? (<editappacl-new-sharing>)? (<editappacl-dryrun>)? (<editappacl-allow-create>)? (<editappacl-validate-roles>)? (<editappacl-journal>)? (<editappacl-max-stanzas>)? (<editappacl-max-impacted-objects>)?
shortdesc = Rewrites the GENERIC permission stanzas of applications - the app default and the family headers - through the REST API.
description = One input row designates ONE GENERIC STANZA: the application default \
              "[]", or a family header such as "[views]". Writing one moves the \
              effective rights of every object of the application that has no stanza of \
              its own - OBJECTS THE PIPELINE DOES NOT ENUMERATE. That is what the \
              command is for, and it is why its guard rails count two different things: \
              "max_stanzas" bounds the number of ACTS, "max_impacted_objects" bounds the \
              estimated BLAST RADIUS. \p\\
              CREATING a generic stanza is IRREVERSIBLE: no measured REST path removes \
              one, at any level. A target that has no stanza yet is therefore REFUSED by \
              default, with acl_status="rejected" and acl_error="irreversible_creation"; \
              "allow_create=true" is the deliberate act, and the created stanzas come \
              out as "created", are EXCLUDED from "app_acl_rollback" and listed by \
              "app_acl_irreversible". \p\\
              Each parameter NAMES THE SPL FIELD from which to read one piece of \
              information, and defaults to the field names "app_acl_inventory" emits: a \
              pipeline built on it needs NO parameter at all. It is the PRESENCE OF THE \
              COLUMN that decides between modifying and preserving, exactly as in \
              "editacl". \p\\
              "stanza_kind" is REQUIRED and never deduced: the two targets have neither \
              the same URI nor the same blast radius, and deducing the application \
              default from an empty family value would write "[]" on a batch whose \
              family column is merely missing. \p\\
              It is in SIMULATION by default. The simulation covers the WHOLE batch - \
              neither ceiling ever fires on it - and ends with three numbers: how many \
              stanzas would be written, how many objects they would move, and how many \
              of those writes would be irreversible creations. \p\\
              A target whose value already matches comes out as "noop" when it carries a \
              stanza, and as "noop_inherited" when it does not: the value is already \
              right, but it is INHERITED, and the command deliberately does not \
              materialize a stanza whose effect would be nil - doing so would remove the \
              family from generic governance for nothing. \p\\
              A non-2xx answer does NOT prove that nothing was written: a write has been \
              measured despite an error. Such a target carries \
              acl_warning="write_may_have_occurred", the journal records \
              write_asserted="unknown", and it ENTERS the rollback set. \i\\
              Requires the "edit_app_acl_bulk" capability, which is distinct from \
              "edit_acl_bulk" and implies neither of it.
usage = public
category = results::write
tags = acl permission permissions role roles sharing rights share app application metadata
related = editacl rest
example1 = | app_acl_inventory apps=my_app | where acl_stanza_kind="family_default" | eval "eai:acl.perms.read"="power" | editappacl
comment1 = Simulation over the family headers of one application: shows what would be written, how many objects each write would move, and which targets are irreversible creations. No parameter is needed, since the inventory emits the expected field names.
example2 = | app_acl_inventory apps=my_app | where acl_stanza_kind="family_default" AND acl_present_local="true" | eval "eai:acl.perms.read"="power" | editappacl dryrun=false max_stanzas=10
comment2 = Real write restricted to the families that ALREADY carry a stanza: every target is then a modification, hence reversible, and no creation can slip into the batch.
example3 = | app_acl_inventory apps=my_app | where acl_stanza_kind="app_default" | eval "eai:acl.perms.read"="power", "eai:acl.perms.write"="admin" | editappacl dryrun=false allow_create=true max_impacted_objects=500
comment3 = First governance of an application: the "[]" stanza does not exist yet, so the write is a CREATION and requires "allow_create=true". Raising the blast-radius ceiling states the volume of objects being moved.
example4 = | `app_acl_rollback(1754483000.1)` | editappacl dryrun=false allow_create=false max_stanzas=50
comment4 = Rollback of an execution designated by its "sid": the macro re-emits the values recorded before each write, and "allow_create=false" is not negotiable - a restore never creates anything. The stanzas CREATED by that execution are NOT in this set, and "app_acl_irreversible" is what lists them.

[editappacl-app]
syntax = app=<field>
description = Field carrying the TARGET APPLICATION. Required with a value. The \
              "system" application is rejected. \p\\
              The application segment is the only part of the URI that comes from the \
              data; the namespace segment is the literal "nobody" and is NEVER derived \
              from a field - with any other value splunkd answers 200 and writes a \
              PRIVATE metadata file, invisible to everybody else.
default = "app=eai:acl.app"

[editappacl-stanza-kind]
syntax = stanza_kind=<field>
description = Field carrying "app_default" or "family_default". REQUIRED, and never \
              deduced from the other fields: an absent, empty or out-of-domain value \
              rejects the event with acl_error="invalid_stanza_kind" and issues no call.
default = "stanza_kind=acl_stanza_kind"

[editappacl-handler]
syntax = handler=<field>
description = Field carrying the HANDLER PATH of the family, primary resolution route. \
              It does NOT go through the shipped table, which is what makes a rollback \
              independent of that table's coverage. Ignored for "app_default", whose URI \
              is entirely determined by the application.
default = "handler=acl_handler"

[editappacl-stanza]
syntax = stanza=<field>
description = Field carrying the FAMILY NAME, secondary resolution route through the \
              shipped table. A family absent from the table rejects the event with \
              acl_error="unresolved_family": no derivation heuristic is applied. \p\\
              An EMPTY value is legitimate - it is the name of the "[]" stanza - which \
              is why the kind of target is read from "stanza_kind" and never from this \
              field alone.
default = "stanza=acl_stanza"

[editappacl-new-perms-read]
syntax = new_perms_read=<field>
description = Field carrying the TARGET value of "perms.read". Column absent from the \
              result set: the attribute is preserved as read. Column present and cell \
              empty: the attribute is EMPTIED. \p\\
              Both permissions are always transmitted, whatever is asked: the write path \
              replaces the whole "access" line as soon as one permission is present, so \
              sending only one of them DELETES the other.
default = "new_perms_read=eai:acl.perms.read"

[editappacl-new-perms-write]
syntax = new_perms_write=<field>
description = Field carrying the TARGET value of "perms.write". Same presence semantics \
              as "new_perms_read".
default = "new_perms_write=eai:acl.perms.write"

[editappacl-new-sharing]
syntax = new_sharing=<field>
description = Field carrying the TARGET value of "sharing", among "app" and "global" \
              ONLY. "user" is refused per event: the platform answers 400 on both write \
              paths - an application and a family container cannot be unshared. An EMPTY \
              cell rejects the event as well, an empty scope having no existence. \p\\
              "sharing" is the only lever on the export: "app" writes "export = none", \
              "global" writes "export = system". "export" itself is never transmitted, \
              both handlers refusing it.
default = "new_sharing=eai:acl.sharing"

[editappacl-dryrun]
syntax = dryrun=<bool>
description = Simulation. True by default: no write is issued, while the read, the \
              provenance, the merge and the impact estimate all take place, so the \
              refusals - irreversible creations included - are VISIBLE BEFORE writing. \
              "dryrun=false" is necessary to actually modify anything.
default = "dryrun=true"

[editappacl-allow-create]
syntax = allow_create=<bool>
description = Authorizes the CREATION of a stanza that does not exist yet, which is an \
              IRREVERSIBLE operation. False by default: a missing target comes out as \
              "rejected" / "irreversible_creation" without any call. \p\\
              The cost is paid once per application: the first governance of an app is \
              necessarily a creation, the following ones are modifications and pass \
              without friction.
default = "allow_create=false"

[editappacl-validate-roles]
syntax = validate_roles=<bool>
description = Check that the ADDED roles exist before writing. An unknown role already \
              present on the stanza and left untouched does not block; it is reported \
              through "acl_warning".
default = "validate_roles=true"

[editappacl-journal]
syntax = journal=<bool>
description = Recording in the indexed journal, with its OWN file and its OWN \
              sourcetype, distinct from those of "editacl". The intent line is written \
              and synchronized to disk BEFORE the call, never only on success: a write \
              can happen despite an error return, and the journal is what makes that \
              case recoverable. Turning it off deprives the execution of any rollback.
default = "journal=true"

[editappacl-max-stanzas]
syntax = max_stanzas=<int>
description = Maximum number of stanzas WRITTEN per execution, that is, the number of \
              ACTS - some of which cannot be undone. Default 5, which is A CHOICE AND \
              NOT A MEASUREMENT. \p\\
              It is a write counter: the statuses without a POST do not count toward it, \
              and SIMULATION NEVER COUNTS toward it. When the ceiling is reached the \
              command STOPS WRITING WITHOUT INTERRUPTING the search - the following \
              targets come out as "skipped_ceiling", the output stays complete, and a \
              single warning says how many were skipped. Running again with a higher \
              ceiling finishes the batch, the stanzas already written coming out as \
              "noop".
default = "max_stanzas=5"

[editappacl-max-impacted-objects]
syntax = max_impacted_objects=<int>
description = Maximum SUM OF THE ESTIMATED IMPACTS of the stanzas written per execution. \
              Default 200, which is A CHOICE AND NOT A MEASUREMENT. \p\\
              It bounds what the run MOVES, where "max_stanzas" bounds what it DOES, and \
              neither is enough on its own: one write on the default of a large \
              application is a single act with an immense reach, and twenty writes on \
              empty families move nothing at all. \p\\
              A target whose estimate alone exceeds the ceiling comes out as \
              "skipped_impact_ceiling": stating the volume is left to the operator. The \
              estimate is a LOWER BOUND when the account cannot see every object.
default = "max_impacted_objects=200"
