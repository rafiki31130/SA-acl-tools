# Assistant de recherche et coloration syntaxique de `editacl` (§2, §4.1).
#
# Sans ce fichier la commande existe — `commands.conf` la declare et splunkd
# l'execute — mais l'interface de recherche l'ignore : le nom n'est pas colorise,
# l'assistant n'affiche ni syntaxe, ni description, ni exemple. Le manque est
# silencieux, aucune erreur n'est levee nulle part.
#
# Deux conditions, et il faut les DEUX. La premiere est ce fichier. La seconde est sa
# VISIBILITE depuis le contexte applicatif ou l'operateur saisit sa recherche — l'app
# `search`, pas `SA-acl-tools` : l'assistant lit `configs/conf-searchbnf` dans le
# namespace de la page. D'ou la stanza `[searchbnf] export = system` de
# `metadata/default.meta`, sans laquelle ce fichier est syntaxiquement valide,
# correctement charge, et sans le moindre effet visible.
#
# `usage = public` est requis : l'assistant de recherche n'opere que sur les commandes
# publiques.
#
# Le nom de stanza `[<commande>-command]` est impose par la plateforme ; il doit
# correspondre a la stanza `[editacl]` de `commands.conf`.
#
# La syntaxe decrite ici est celle du §4.1 du cahier des charges. Toute evolution du
# contrat d'entree de la commande se reporte ici, faute de quoi l'assistant affiche a
# l'operateur une syntaxe qui n'est plus celle du code. `tests/test_app_layout.py`
# verrouille mecaniquement la correspondance entre les options declarees ici et les
# `Option` de `bin/editacl.py`.
#
# Un redemarrage de splunkd est necessaire pour que la plateforme prenne ce fichier en
# compte.

[editacl-command]
syntax = editacl (<editacl-fields>)? (<editacl-dryrun>)? (<editacl-validate-roles>)? (<editacl-journal>)? (<editacl-max-objects>)?
shortdesc = Reecrit en masse les ACL des objets de connaissance decrits par le pipeline d'entree, via l'API REST.
description = Chaque evenement d'entree designe un objet de connaissance par "title", \
              "eai:acl.app", "eai:acl.owner", plus "id" ou "eai:type", et porte l'etat \
              ACL cible. La commande lit l'etat courant par l'API REST, calcule l'etat \
              cible en ne prenant de l'evenement que les attributs listes dans \
              "fields", puis ecrit. \p\\
              Elle est en SIMULATION par defaut : sans "dryrun=false" aucune ecriture \
              n'est emise, les objets ressortent en "dryrun" et rien n'est modifie. \p\\
              Un attribut absent de "fields" est preserve tel que lu ; un attribut \
              present dans "fields" dont le champ est absent, nul ou vide est VIDE. \
              La presence du champ dans l'evenement ne decide de rien, seul "fields" \
              decide. \p\\
              Chaque ecriture reelle est precedee d'une ligne de journal ecrite et \
              synchronisee sur disque, ce qui rend l'operation reversible par les \
              macros de restauration. Les objets deja conformes ressortent en "noop", \
              y compris en simulation. \i\\
              Requiert la capability "edit_acl_bulk".
usage = public
category = results::write
tags = acl permission permissions role roles sharing owner droits partage
related = rest
example1 = | `acl_inventory` | search "eai:acl.perms.write"="ancien_role" | eval "eai:acl.perms.write"="nouveau_role_admin" | editacl fields="perms.write"
comment1 = Simulation, sur l'inventaire complet : montre ce que produirait la substitution du role obsolete, sans rien ecrire. C'est le comportement par defaut.
example2 = | `acl_inventory(savedsearch,views)` | search "eai:acl.perms.write"="ancien_role" | eval "eai:acl.perms.write"="nouveau_role_admin" | editacl fields="perms.write" dryrun=false max_objects=2000
comment2 = Ecriture reelle, restreinte aux recherches sauvegardees et aux vues. "dryrun=false" est la seule chose qui distingue une simulation d'une modification.
example3 = | `editacl_rollback(1754483000.1)` | editacl fields="perms.read,perms.write,sharing" dryrun=false
comment3 = Retour arriere d'une execution a partir de son journal indexe, designee par son "sid".

[editacl-fields]
syntax = fields=<string>
description = Attributs ACL a prendre depuis l'evenement, separes par des virgules. \
              Valeurs admises : "perms.read", "perms.write", "sharing". Toute autre \
              valeur, "owner" comprise, est une erreur fatale de parametre. \p\\
              A PLACER ENTRE GUILLEMETS des qu'il y a plus d'une valeur : sans \
              guillemets, SPL tronque la liste a sa PREMIERE valeur, sans erreur et \
              sans avertissement. La forme correcte est "fields=\"perms.read,perms.write\"".
default = "fields=\"perms.read,perms.write\""

[editacl-dryrun]
syntax = dryrun=<bool>
description = Simulation. Vrai par defaut : aucune ecriture n'est emise, le GET est \
              effectue, la fusion calculee, le resultat emis et journalise. \
              "dryrun=false" est necessaire pour modifier reellement les objets.
default = "dryrun=true"

[editacl-validate-roles]
syntax = validate_roles=<bool>
description = Controle de l'existence des roles AJOUTES avant ecriture. Un role \
              inconnu deja present sur l'objet et non modifie par l'operation ne \
              bloque pas ; il est signale par "acl_warning".
default = "validate_roles=true"

[editacl-journal]
syntax = journal=<bool>
description = Consignation dans le journal indexe, deux lignes par ecriture, sur \
              lequel s'appuient les macros de restauration. Le desactiver prive \
              l'execution de tout retour arriere.
default = "journal=true"

[editacl-max-objects]
syntax = max_objects=<int>
description = Nombre maximal d'objets ECRITS par execution. C'est un compteur \
              d'ecritures, pas une pre-condition sur le lot : les statuts sans POST \
              n'y entrent pas. A l'atteinte du plafond la recherche s'interrompt en \
              erreur, les objets deja ecrits ne sont pas annules et la sortie de \
              recherche est perdue — le journal reste la seule trace.
default = "max_objects=500"
