# Search assistant and syntax highlighting for `editacl` (spec sections 2.3 and 4.1).
#
# Without this file the command exists, since `commands.conf` declares it and splunkd
# executes it, but the search interface ignores it: the name is not colored, and the
# assistant shows neither syntax, nor description, nor example. The gap is silent, and
# no error is raised anywhere.
#
# Two conditions, and BOTH are needed. The first one is this file. The second one is
# its VISIBILITY from the application context where the operator types the search,
# that is the `search` app, not `SA-acl-tools`: the assistant reads
# `configs/conf-searchbnf` in the namespace of the page. Hence the
# `[searchbnf] export = system` stanza of `metadata/default.meta`, without which this
# file is syntactically valid, correctly loaded, and without the slightest visible
# effect. Measured on the reference platform: without the export,
# `configs/conf-searchbnf` returns `total = 0` in the namespace of the search.
#
# `usage = public` is required: the search assistant only operates on public commands.
#
# The stanza name `[<command>-command]` is imposed by the platform; it must match the
# `[editacl]` stanza of `commands.conf`.
#
# The syntax described here is the one of section 4.1 of the specification. Any change
# to the input contract of the command must be carried over here, failing which the
# assistant shows the operator a syntax that is no longer the one of the code.
# `tests/test_app_layout.py` mechanically locks the correspondence between the options
# declared here and the `Option` declarations of `bin/editacl.py`.
#
# A restart of splunkd is needed for the platform to take this file into account.

[editacl-command]
syntax = editacl (<editacl-title>)? (<editacl-app>)? (<editacl-id>)? (<editacl-type>)? (<editacl-sharing>)? (<editacl-new-perms-read>)? (<editacl-new-perms-write>)? (<editacl-new-sharing>)? (<editacl-new-owner>)? (<editacl-dryrun>)? (<editacl-validate-roles>)? (<editacl-journal>)? (<editacl-max-objects>)?
shortdesc = Bulk-rewrites the ACLs of the knowledge objects described by the input pipeline, through the REST API.
description = Each parameter NAMES THE SPL FIELD from which to read one piece of \
              information, and defaults to the platform's native field names \
              ("title", "eai:acl.app", "eai:type", "id", "eai:acl.perms.read", ...). \
              A pipeline built on `acl_inventory` therefore needs NO parameter at \
              all. \p\\
              It is the PRESENCE OF THE COLUMN in the result set that decides between \
              modifying and preserving: column absent, the attribute is preserved as \
              read; column present and cell empty, the attribute is EMPTIED; column \
              present and valued, the value is applied. Neither the type of the value \
              nor its content enters into that decision. \p\\
              WARNING: presence is a property of the RESULT SET, not of the event. A \
              pipeline that populates a field for only some of its rows WOULD EMPTY \
              the attribute on the others. \p\\
              Two attributes cannot be emptied: "sharing" and "owner" have no empty \
              value on the platform side, and an empty cell there REJECTS the \
              event. \p\\
              It is in SIMULATION by default: without "dryrun=false" no write is \
              issued, the objects come out as "dryrun" and nothing is modified. The \
              simulation always covers the WHOLE batch, the ceiling never biting on it. \p\\
              Addressing is done through a fixed context: no parameter designates an \
              addressing owner, and private objects come out as \
              "skipped_private". \p\\
              Every real write is preceded by a journal line written and synchronized \
              to disk, which makes the operation reversible through the rollback \
              macros. Objects that are already compliant come out as "noop", \
              including in simulation. \i\\
              Requires the "edit_acl_bulk" capability.
usage = public
category = results::write
tags = acl permission permissions role roles sharing owner rights share
related = rest
example1 = | `acl_inventory` | search "eai:acl.perms.write"="legacy_role" | eval "eai:acl.perms.write"="new_role_admin" | editacl
comment1 = Simulation, over the complete inventory: shows what the substitution of the obsolete role would produce, without writing anything. No parameter is needed, since the macro emits the platform's native field names. This is the default behavior.
example2 = | `acl_inventory(savedsearch,views)` | search "eai:acl.perms.write"="legacy_role" | eval "eai:acl.perms.write"="new_role_admin" | editacl dryrun=false max_objects=2000
comment2 = Real write, restricted to saved searches and views. "dryrun=false" is the only thing that tells a simulation from a modification; "max_objects" must be raised beyond ten written objects.
example3 = | `acl_inventory(savedsearch)` | rename "eai:acl.perms.write" AS write, "eai:type" AS object_type | editacl type=object_type new_perms_write=write
comment3 = Fields renamed by the upstream pipeline: each parameter redirects the reading of one piece of information to a different column name.
example4 = | `editacl_rollback_apply(1754483000.1)`
comment4 = Complete rollback of an execution from its indexed journal, designated by its "sid". The macro carries the invocation, the previous owner included.

[editacl-title]
syntax = title=<field>
description = Field carrying the NAME of the object, last segment of the REST path. \
              Required with a value: the designated field must exist and carry a value.
default = "title=title"

[editacl-app]
syntax = app=<field>
description = Field carrying the APPLICATION of the namespace. Required with a value. \
              An object in the "system" application is rejected.
default = "app=eai:acl.app"

[editacl-id]
syntax = id=<field>
description = Field carrying the COMPLETE URI of the object, primary resolution path \
              for the endpoint. An "id" emitted by "admin/directory" is discarded in \
              favor of the mapping table.
default = "id=id"

[editacl-type]
syntax = type=<field>
description = Field carrying the object TYPE, resolved through the mapping table. At \
              least one of the two paths, "id" or "type", must be usable.
default = "type=eai:type"

[editacl-sharing]
syntax = sharing=<field>
description = Field carrying the CURRENT sharing scope of the object, used to skip \
              private objects as "skipped_private". \p\\
              Without it, the scope is looked for in the namespace carried by "id". \
              If "id" does not carry it either, the command CAN NO LONGER \
              DISCRIMINATE: it resolves through the fixed context and therefore \
              reaches the SHARED object of that name if one exists, whereas the row \
              may have designated a private object of the same name. The event then \
              carries acl_warning="scope_undetermined". Building the pipeline on the \
              inventory macro, which always emits both, makes this case unreachable.
default = "sharing=eai:acl.sharing"

[editacl-new-perms-read]
syntax = new_perms_read=<field>
description = Field carrying the TARGET value of "perms.read". Column absent from the \
              result set: the attribute is preserved. Column present and cell empty: \
              the attribute is emptied.
default = "new_perms_read=eai:acl.perms.read"

[editacl-new-perms-write]
syntax = new_perms_write=<field>
description = Field carrying the TARGET value of "perms.write". Same presence \
              semantics as "new_perms_read": that is how an "mvmap" removing the last \
              value does empty the attribute.
default = "new_perms_write=eai:acl.perms.write"

[editacl-new-sharing]
syntax = new_sharing=<field>
description = Field carrying the TARGET value of "sharing", among "user", "app" and \
              "global". An EMPTY cell, or one outside those three values, REJECTS the \
              event: an empty sharing scope does not exist on the platform side.
default = "new_sharing=eai:acl.sharing"

[editacl-new-owner]
syntax = new_owner=<field>
description = Field carrying the TARGET value of "owner". An EMPTY cell rejects the \
              event, symmetrically to "new_sharing". This parameter is NOT used for \
              addressing, which is done through a fixed context: it describes an \
              ownership takeover, which requires "admin_all_objects" and an existing \
              target owner.
default = "new_owner=eai:acl.owner"

[editacl-dryrun]
syntax = dryrun=<bool>
description = Simulation. True by default: no write is issued, the GET is performed, \
              the merge computed, the outcome emitted and journaled. "dryrun=false" \
              is necessary to actually modify the objects.
default = "dryrun=true"

[editacl-validate-roles]
syntax = validate_roles=<bool>
description = Check that the ADDED roles exist before writing. An unknown role that \
              is already present on the object and is not modified by the operation \
              does not block; it is reported through "acl_warning".
default = "validate_roles=true"

[editacl-journal]
syntax = journal=<bool>
description = Recording in the indexed journal, two lines per write, on which the \
              rollback macros rely. Turning it off deprives the execution of any \
              rollback.
default = "journal=true"

[editacl-max-objects]
syntax = max_objects=<int>
description = Maximum number of objects WRITTEN per execution. It is a write counter, \
              not a pre-condition on the batch: the statuses without a POST do not \
              count toward it, and SIMULATION NEVER COUNTS toward it, a "dryrun" \
              always covering the whole batch. \p\\
              When the ceiling is reached the command STOPS WRITING WITHOUT \
              INTERRUPTING the search: the following objects come out as \
              "skipped_ceiling", the output stays complete, the job is not marked as \
              failed, and a single warning says how many objects were skipped. \
              Running the same search again with a higher ceiling finishes the batch: \
              the objects already written come out as "noop", by idempotence.
default = "max_objects=10"
