# Definitions de lookup utilisees par les macros et les recherches livrees.
#
# `acl_object_families` : famille d'objets -> chemin de handler natif. C'est la table
# que parcourt `acl_inventory` pour construire l'union des endpoints natifs, et c'est
# elle qui porte la valeur d'`eai:type` synthetisee (§6.7 contrainte 4).
#
# Elle est le pendant SPL de `bin/acl_endpoint_map.json`, que le code Python lit et que
# SPL ne sait pas lire. Regle qui les distingue : le JSON porte UNE ENTREE PAR CLE
# `eai:type` (deux cles peuvent viser le meme handler), le CSV porte UNE LIGNE PAR
# HANDLER — sans quoi l'inventaire enumererait deux fois le meme endpoint. La coherence
# des deux fichiers est controlee par `tools/revalidate_mapping.py` (§6.5).

[acl_object_families]
filename = acl_object_families.csv
case_sensitive_match = false

# `acl_decommissioned_roles` : liste des roles a retirer des ACL, alimentant la
# recherche « ACL - references aux roles decommissionnes ». Le fichier livre ne
# contient que des identifiants generiques d'exemple ; l'exploitant le remplace par sa
# propre liste, de preference dans `lookups/` de l'app locale plutot qu'en ecrasant le
# fichier livre, qu'une mise a jour d'app remplacerait.

[acl_decommissioned_roles]
filename = acl_decommissioned_roles.csv
case_sensitive_match = false
