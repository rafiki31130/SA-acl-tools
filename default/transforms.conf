# Lookup definitions used by the macros and by the shipped searches.
#
# `acl_object_families`: object family -> native handler path. This is the table that
# `acl_inventory` walks to build the union of the native endpoints, and it is the one
# that carries the synthesized `eai:type` value (spec section 6.7 constraint 4).
#
# It is the SPL counterpart of `bin/acl_endpoint_map.json`, which the Python code reads
# and which SPL cannot read. The rule that tells them apart: the JSON carries ONE ENTRY
# PER `eai:type` KEY (two keys may point at the same handler), the CSV carries ONE ROW
# PER HANDLER; otherwise the inventory would enumerate the same endpoint twice. The
# consistency of the two files is checked by `tools/revalidate_mapping.py`
# (section 6.5).

[acl_object_families]
filename = acl_object_families.csv
case_sensitive_match = false

# `acl_decommissioned_roles`: the list of roles to remove from the ACLs, feeding the
# "ACL - references to decommissioned roles" search. The shipped file only contains
# generic example identifiers; the operator replaces it with their own list,
# preferably under `lookups/` in the local app rather than by overwriting the shipped
# file, which an app update would replace.

[acl_decommissioned_roles]
filename = acl_decommissioned_roles.csv
case_sensitive_match = false
