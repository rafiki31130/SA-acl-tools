# Les six cles ci-dessous sont normatives (cahier des charges §2.1).
#
# local = true          : execution exclusive sur le search head, jamais de
#                         distribution vers les indexeurs.
# run_in_preview = false: neutralise les reexecutions liees a la generation
#                         d'apercus. Condition necessaire mais non suffisante :
#                         l'idempotence (§5.5) reste obligatoire.
# maxinputs = 0         : desactive le plafond par defaut (50 000). Le garde-fou
#                         volumetrique est porte par la commande elle-meme (§4.3).

[editacl]
filename        = editacl.py
chunked         = true
python.version  = python3
local           = true
run_in_preview  = false
is_risky        = true
maxinputs       = 0
