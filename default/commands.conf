# The seven keys below are normative (specification section 2.1): filename,
# chunked, python.version, local, run_in_preview, is_risky, maxinputs.
#
# local = true          : runs on the search head only, never distributed to the
#                         indexers.
# run_in_preview = false: neutralizes the re-executions caused by preview
#                         generation. A necessary but not sufficient condition:
#                         idempotence (section 5.5) remains mandatory.
# maxinputs = 0         : disables the default ceiling (50 000). The volume guard
#                         rail is carried by the command itself (section 4.3).

[editacl]
filename        = editacl.py
chunked         = true
python.version  = python3
local           = true
run_in_preview  = false
is_risky        = true
maxinputs       = 0

# `editappacl` (v4.1 section 8.1): same normative key set, same values. The command
# writes the GENERIC stanzas of an application's `metadata/local.meta`, so it is risky
# for the same reason as the previous one - more so, in fact, since one write moves the
# rights of objects the pipeline does not enumerate, and creating a stanza cannot be
# undone.
#
# `local = true` also carries a second reason here: the command reads the `.meta` files
# of the member it runs on (v4.1 section 6), and distributing it would make it read an
# arbitrary member's tree.

[editappacl]
filename        = editappacl.py
chunked         = true
python.version  = python3
local           = true
run_in_preview  = false
is_risky        = true
maxinputs       = 0

# `app_acl_inventory` (v4.1 section 7.2): the same seven normative keys, with the ONE
# justified divergence of value.
#
# is_risky = false : the command mutates nothing. Marking a read-only command risky would
#                    put a confirmation dialog in front of an inventory, and the point of
#                    a confirmation is that it is rare enough to be read.
# local = true     : it reads the metadata files of the member it runs on (section 6),
#                    so distributing it would make it read an arbitrary member's tree -
#                    and the whole value of the SHC comparison of section 6.3 rests on
#                    knowing WHICH member answered.
#
# The GENERATING character is NOT declared here (HY-1, established from the SDK): under
# the chunked protocol it is carried by the `GeneratingCommand` base class, which fixes
# `generating` as a read-only configuration setting announced for both protocol versions.
# No eighth key was needed, and if one ever is, it goes into this normative set AND into
# the test that freezes it - never glossed in on the side.

[app_acl_inventory]
filename        = app_acl_inventory.py
chunked         = true
python.version  = python3
local           = true
run_in_preview  = false
is_risky        = false
maxinputs       = 0
