# Dedicated capability (spec section 7). Splunk offers no native gating of search
# commands by capability: the check is implemented in the code, at the head of
# execution (section 5.1), and a failed check is a fatal error.
#
# **The app GRANTS the capability to the `admin` role** (D-29) instead of merely
# declaring it. The tool is therefore usable from the moment it is deployed by the
# accounts that already hold `admin_all_objects`, which is required anyway for most of
# the writes. Declaring it without granting it produced an app that was installed,
# loaded, and unusable until a manual change to the roles that nothing announced.
#
# Granting it to any other role belongs to the role management chain, outside the app.
#
# The capability only appears in `current-context` once the app has been installed and
# splunkd restarted (measurement 6).

[capability::edit_acl_bulk]

# Dedicated capability of the APPLICATION-LEVEL write command (v4.1 section 8.1). It is
# NOT implied by `edit_acl_bulk` and does not imply it, and that is the whole point:
# `edit_acl_bulk` authorizes rewriting the ACL of objects the pipeline ENUMERATES, while
# `edit_app_acl_bulk` authorizes moving the rights of objects the pipeline does NOT
# enumerate and whose number is only known by estimation. The blast radius differs by
# orders of magnitude, and this file is the only place the app can express that
# difference - `admin_all_objects` does not tell them apart.
#
# Granted to `admin` at installation, same doctrine as above (D-29): declaring without
# granting produces an app that is installed, loaded and unusable.

[capability::edit_app_acl_bulk]

# Dedicated capability of the INVENTORY command (v4.1 section 7.6). Its motive is proper
# to that command and is the direct counterpart of the file-reading exception of
# section 6: **reading the metadata file short-circuits the capability filtering that
# REST applies**. The frozen-stanza counters of an application carry information the API
# would not serve to a caller without `admin_all_objects`, so the app gates the command
# rather than pretending the exposure does not exist.
#
# Bound 3 of section 6.2 already reduces that exposure - counts leave the module, never
# object names - and this capability governs what is left. Both halves are needed:
# without the bound, the command would leak names; without the capability, it would leak
# counts to anybody.
#
# Granted to `admin` at installation, same doctrine as above (D-29).

[capability::list_app_acl]

[role_admin]
edit_acl_bulk = enabled
edit_app_acl_bulk = enabled
list_app_acl = enabled

# Read role of the monitoring view (specification section 15.4, D-44, D-47). The app
# DECLARES it and grants it to NOBODY: accounts holding `admin_all_objects` already
# read the view, so granting it would add no access and would widen a population
# nobody asked to widen. That is the difference with `edit_acl_bulk` above, where not
# granting produced an app that was installed and unusable.
#
# `search` is granted because without it the app would ship a role that is unusable by
# construction: a holder opening the view gets `insufficient permission to access this
# resource` on every panel. MEASURED.
#
# `run_collect`, `run_mcollect` and `schedule_rtsearch` are refused explicitly. A role
# declared bare is NOT empty: it inherits from the platform `[default]` stanza, which
# on a stock install carries all three. A role named "auditor" that may write into a
# summary index does not do what its name announces; and a role that may schedule a
# real-time search would contradict the doctrine of the app itself, since the command
# refuses by design to run under a real-time search.
#
# The two other inherited capabilities are left in place: `edit_own_objects` only
# bears on the user's own private objects, and `list_all_objects` is reading, which is
# precisely the business of this role.
#
# NO INDEX ENTITLEMENT IS DECLARED - no `srchIndexesAllowed`, no `srchIndexesDefault`,
# no `srchFilter`. Reading the index the journal lands in belongs to the role
# management chain, outside this app, exactly as granting the role itself does. The
# view carries a guard that tells "no run recorded" from "index not readable" rather
# than showing an empty page (D-48).
#
# The `[default]` stanza belongs to the platform, not to this app: the effective
# content of this role depends on the installation. The app can refuse what it knows
# it must refuse; it can guarantee nothing beyond that.

[role_editacl_auditor]
search = enabled
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled
