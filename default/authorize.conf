# Capability dediee (§7). Splunk n'offre pas de gating natif des commandes de
# recherche par capability : le controle est implemente dans le code, en tete
# d'execution (§5.1), et constitue une erreur fatale.
#
# **L'app ATTRIBUE la capability au role `admin`** (D-29), au lieu de se contenter de la
# declarer. L'outil est donc utilisable des le deploiement par les comptes qui portent
# deja `admin_all_objects` — lequel est de toute facon requis pour l'essentiel des
# ecritures. La declarer sans l'attribuer produisait une app installee, chargee, et
# inutilisable jusqu'a une intervention manuelle sur les roles que rien ne signalait.
#
# Toute attribution a d'autres roles releve de la chaine de gestion des roles, hors de
# l'app.
#
# La capability n'apparait dans `current-context` qu'apres installation de l'app et
# redemarrage de splunkd (mesure 6).

[capability::edit_acl_bulk]

[role_admin]
edit_acl_bulk = enabled
