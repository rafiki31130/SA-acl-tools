# Dedicated capability (spec section 7). Splunk offers no native gating of search
# commands by capability: the check is implemented in the code, at the head of
# execution (section 5.1), and a failed check is a fatal error.
#
# **The app GRANTS the capability to the `admin` role** (D-29) instead of merely
# declaring it. The tool is therefore usable from the moment it is deployed by the
# accounts that already hold `admin_all_objects`, which is required anyway for most of
# the writes. Declaring it without granting it produced an app that was installed,
# loaded, and unusable until a manual change to the roles that nothing announced.
#
# Granting it to any other role belongs to the role management chain, outside the app.
#
# The capability only appears in `current-context` once the app has been installed and
# splunkd restarted (measurement 6).

[capability::edit_acl_bulk]

[role_admin]
edit_acl_bulk = enabled
