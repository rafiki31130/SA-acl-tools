# Macros livrees par SA-acl-tools.
#
# `acl_inventory` / `acl_inventory(1)` : inventaire des objets de connaissance, bati
# sur les ENDPOINTS NATIFS et non sur `admin/directory` (cahier des charges §6.7).
# `editacl_rollback(1)`                : jeu de restauration d'une execution, en
#                                        PREVISUALISATION (§8.6).
# `editacl_rollback_apply(1)`          : le meme, suivi de l'invocation `| editacl`
#                                        complete et correctement quotee — ECRIT (D-13).
#
# Les deux formes d'inventaire partagent une meme implementation, `acl_inventory_base`,
# qui n'est pas destinee a etre invoquee directement.
#
# Pourquoi ne pas se contenter de `| rest ... /admin/directory` : ce handler
# d'agregation ne voit qu'une fraction des objets (60,6 % sur le socle de reference),
# n'emet aucun fichier de lookup ni aucun modele de donnees, et 100 % des `id` qu'il
# produit sont auto-referents donc inexploitables pour adresser l'objet.

[acl_inventory]
definition = `acl_inventory_base("")`
description = Inventaire complet des objets de connaissance, toutes familles, bati sur \
les endpoints natifs. Emet exactement le contrat d'entree de `editacl` : title, \
eai:acl.app, eai:acl.owner, eai:acl.perms.read, eai:acl.perms.write, eai:acl.sharing, \
eai:type, id. Usage : | `acl_inventory` | search ... | editacl ...
iseval = 0

# Forme parametree : `acl_inventory(<famille>[,<famille>...])`.
#
# Les noms de famille sont les cles de la table de correspondance — colonne `family`
# du lookup `acl_object_families`. Seuls les endpoints des familles demandees sont
# interroges : c'est le levier de cout pour un usage interactif (§6.7 contrainte 2).
#
# Usage : | `acl_inventory(savedsearch,views)` | search ... | editacl ...
#
# Splunk indexe les macros par ARITE : `acl_inventory(savedsearch,views)` est un appel
# a DEUX arguments et cherche la stanza `[acl_inventory(2)]`, pas `[acl_inventory(1)]`
# avec une chaine « savedsearch,views ». La forme parametree du cahier des charges
# impose donc une stanza par nombre d'arguments. Le plafond est le nombre de familles
# du lookup livre (27) : au-dela, l'inventaire complet sans argument est la bonne
# reponse. Chaque stanza recompose la liste et la passe a `acl_inventory_base`.

[acl_inventory(1)]
args = f1
definition = `acl_inventory_base("$f1$")`
iseval = 0

[acl_inventory(2)]
args = f1, f2
definition = `acl_inventory_base("$f1$,$f2$")`
iseval = 0

