# Macros shipped by SA-acl-tools.
#
# `acl_inventory` / `acl_inventory(1)` : inventory of the knowledge objects, built on
# the NATIVE ENDPOINTS and not on `admin/directory` (specification section 6.7).
# `editacl_rollback(1)`                : rollback set of one execution, as a
#                                        PREVIEW (section 8.6).
# `editacl_rollback_apply(1)`          : the same, followed by the complete and
#                                        correctly quoted `| editacl` invocation. It
#                                        WRITES (D-13).
#
# The two inventory forms share a single implementation, `acl_inventory_base`, which is
# not meant to be invoked directly.
#
# Why not simply use `| rest ... /admin/directory`: that aggregation handler only sees
# a fraction of the objects (60.6 % on the reference platform), emits no lookup file
# and no data model, and 100 % of the `id` values it produces are self-referential,
# hence useless for addressing the object.

[acl_inventory]
definition = `acl_inventory_base("")`
description = Complete inventory of the knowledge objects, all families, built on the \
native endpoints. Emits exactly the input contract of `editacl`: title, \
eai:acl.app, eai:acl.owner, eai:acl.perms.read, eai:acl.perms.write, eai:acl.sharing, \
eai:type, id. Usage: | `acl_inventory` | search ... | editacl ...
iseval = 0

# Parameterized form: `acl_inventory(<family>[,<family>...])`.
#
# The arguments are OBJECT TYPES, in the one vocabulary this app uses for that
# notion: the keys of the mapping table, which are also the `eai_type` column of the
# `acl_object_families` lookup and the values the command journals. Only the
# endpoints of the requested types are queried: that is the cost lever for
# interactive use (section 6.7 constraint 2).
#
# Usage: | `acl_inventory(savedsearch,views)` | search ... | editacl ...
#
# Splunk indexes macros by ARITY: `acl_inventory(savedsearch,views)` is a TWO-argument
# call and looks for the `[acl_inventory(2)]` stanza, not for `[acl_inventory(1)]` with
# a "savedsearch,views" string. The parameterized form of the specification therefore
# requires one stanza per argument count. The ceiling is the number of families in the
# shipped lookup (27): beyond that, the complete inventory without an argument is the
# right answer. Each stanza reassembles the list and passes it to `acl_inventory_base`.

[acl_inventory(1)]
args = f1
definition = `acl_inventory_base("$f1$")`
iseval = 0

[acl_inventory(2)]
args = f1, f2
definition = `acl_inventory_base("$f1$,$f2$")`
iseval = 0

[acl_inventory(3)]
args = f1, f2, f3
definition = `acl_inventory_base("$f1$,$f2$,$f3$")`
iseval = 0

