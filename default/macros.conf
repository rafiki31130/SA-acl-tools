# Shared implementation. Do not invoke directly.
#
# Three design points:
#
#  1. The selection is applied BEFORE the `map`, so a family that was not requested
#     costs no REST call at all. An operator who only handles saved searches does not
#     pay for the enumeration of the lookup files (section 6.7 constraint 2).
#  2. The argument is filtered by `replace` against a character allow list before it
#     is injected into a regular expression: the type name is user input, and it must
#     not be able to alter the regex.
#  3. `eai:type` is SYNTHESIZED when the native endpoint does not emit it (section 6.7
#     constraint 4), from the `eai_type` column of the lookup - that is, from the key
#     of the mapping table, which is the ONE vocabulary this app uses for the object
#     type, end to end: what the operator writes here, what the command journals, what
#     the monitoring view groups on. Measured on 9.4.6: three families out of the
#     twenty-seven emit a type of their own - `datamodel`, `models` and `views` - and
#     each emits exactly the key this table names, so preserving the native value
#     never introduces a second word for the same family.
#
#     The synthesis is no longer what makes a rollback possible: the command now fills
#     the type in itself, by inverting the handler path it resolved, and the rollback
#     macro re-emits `id` besides. The synthesis remains what gives the OPERATOR a
#     type to filter on before the command has seen the row.
[acl_inventory_base(1)]
args = families
definition = inputlookup acl_object_families \
| eval acl_selection = replace("$families$", "[^A-Za-z0-9_,-]", "") \
| eval acl_family_re = if(acl_selection == "", ".*", "^(" . replace(acl_selection, ",", "|") . ")$") \
| where match(eai_type, acl_family_re) \
| fields eai_type, handler_path \
| map maxsearches=200 search="| rest splunk_server=local count=0 /servicesNS/-/-/$handler_path$ | eval acl_synthesized_type=\"$eai_type$\"" \
| eval "eai:type" = if(isnull('eai:type') OR 'eai:type' == "", acl_synthesized_type, 'eai:type') \
| table title, "eai:acl.app", "eai:acl.owner", "eai:acl.perms.read", "eai:acl.perms.write", "eai:acl.sharing", "eai:type", id
description = Shared implementation of `acl_inventory` and `acl_inventory(1)`. \
Do not invoke directly.
iseval = 0

# Rollback set of one execution (section 8.6). The SPL is the one from the
# specification, with the sole addition of the leading `search` keyword, which is
# indispensable for the macro to be invocable in generating position
# (`| `editacl_rollback(<sid>)``).
#
# Its source is named by `acl_journal_source` and no longer written out (D-51,
# section 8.3.bis). It is the artifact where a hard-coded index would cost the most:
# an operator who redirected the journal would get an EMPTY rollback set, reported as
# a success, on the only safety net of an irreversible operation.
#
# The macro only restores the objects for which an `outcome` line attests that the
# write did succeed: an object whose POST failed was not modified, and it must not be
# "restored" to a state it never left.
#
# The `earliest(...) BY endpoint` is defense in depth: deduplication by URI already
# rules out intra-execution duplicates, but the explicit ordering protects against an
# aggregation that would mistakenly span several `sid` values.
#
# The time range of the calling search must cover the execution to be restored.
#
# IT RE-EMITS `id`, AND THAT IS WHAT MAKES THE ROLLBACK WORK ON AN UNTYPED OBJECT.
#
# Until now the macro re-emitted `eai:type` and no object identifier, so the resolution
# of section 5.2 rested on that single field at replay time. An object whose input row
# carried no type - which every batch built on the native endpoints produces, since
# twenty-four of the twenty-seven native handlers emit no `eai:type` - was journaled
# with an empty type and REJECTED at rollback, with its prior state intact in the
# journal. Measured on a batch: 4 saved searches out of 4 rejected, the 3 views
# restored.
#
# The fix costs no new journaled field: `endpoint` was already there. Section 8.5 makes
# it a CONTRACT - `/servicesNS/nobody/<app>/<handler path>/<encoded title>`, identical
# on both phases, carrying neither scheme, nor host, nor port, nor the `/acl` suffix.
# That is exactly the shape route 1 of section 5.2 parses: owner, app, handler path,
# object name. The handler path comes back out of it byte for byte, and the trailing
# segment is thrown away - the title is taken from the `title` field, journaled
# unencoded for that very reason.
#
# Three properties of this re-emission, each of which had to be checked rather than
# assumed:
#
#  1. It is NOT a fallback for the untyped case, it is the route for every case. Route
#     `id` has precedence over route `eai:type` (section 5.2), so a typed object also
#     resolves through it now. That is strictly more faithful: `endpoint` is the URI
#     the command REALLY wrote to, whereas re-resolving `eai:type` through the table
#     re-derives it. `eai:type` is kept and still emitted - it is the fallback if
#     `endpoint` were ever missing, and it remains the object's type for a reader.
#  2. The namespace it carries is `nobody`, the fixed addressing context, so section
#     3.5 reads it as designating a SHARED object. That is correct by construction: a
#     private object is skipped on the outbound pass and is never in a rollback set.
#  3. `admin/directory` cannot appear in it: the endpoint is built from an ALREADY
#     resolved handler, and route 1 discards that aggregation handler upstream.
[editacl_rollback(1)]
args = sid
definition = search `acl_journal_source` sid="$sid$" \
| eval _restorable = if(phase="outcome" AND status="updated", 1, 0) \
| eventstats max(_restorable) AS restorable BY endpoint \
| search phase="intent" restorable=1 \
| stats earliest(before_perms_read)  AS "eai:acl.perms.read", \
        earliest(before_perms_write) AS "eai:acl.perms.write", \
        earliest(before_sharing)     AS "eai:acl.sharing", \
        earliest(before_owner)       AS "eai:acl.owner", \
        earliest(app)                AS "eai:acl.app", \
        earliest(title)              AS title, \
        earliest(eai_type)           AS "eai:type" \
  BY endpoint \
| eval "eai:acl.perms.read"  = coalesce('eai:acl.perms.read',  ""), \
       "eai:acl.perms.write" = coalesce('eai:acl.perms.write', "") \
| eval id = endpoint \
| fields title "eai:acl.*" "eai:type" id
description = Rollback set (preview) of the execution identified by its `sid`. \
Complete it with | editacl dryrun=f and no other parameter: the macro emits the \
platform's native field names, which the four target values pick up by default. \
`eai:acl.owner` carries the PREVIOUS owner, which the default of `new_owner` applies \
without anything having to be named. To avoid depending on that typing, use \
`editacl_rollback_apply(<sid>)`.
iseval = 0

# The `coalesce(..., "")` on the two permission columns is DEFENSE IN DEPTH, and not
# the fix for an observed defect (section 8.6, D-32).
#
# The risk was real in principle: since the rework of section 3.2, an ABSENT column
# preserves the attribute instead of emptying it. If the journaling chain lost an
# empty permission along the way, the rollback would restore nothing while reporting
# a success.
#
# MEASURED ON 9.4.6, IT DOES NOT LOSE IT, and the measurement was redone by a profile
# distinct from the one that had first made it. A permission serialized as "" in the
# journal is EXTRACTED at indexing time: the field is present, its value is the empty
# string, and a control `isnull()` on a non-existent field establishes that the
# instrument does distinguish "absent" from "present and empty". AND it SURVIVES
# AGGREGATION: the `stats earliest(...) BY endpoint` above, run without this
# `coalesce` and filtered on an object whose two permissions are empty on 100 % of the
# aggregated rows, does emit both columns.
#
# The `coalesce` is kept because it costs one line and protects against a behavior
# that nothing obliges another version of the platform to preserve. It is the same
# caution as the re-validation of the mapping table on the target platform
# (section 6.5).
#
# Version 2.3 of the specification claimed on the contrary that the column
# disappeared. That claim had never been measured; it is false.
#
# `eai:acl.sharing` and `eai:acl.owner` are deliberately NOT treated the same way:
# their empty value does not exist on the platform side, a restorable object always
# carries one, and materializing an empty column there would only turn a correct
# preservation into a rejection.

# APPLIED rollback (section 8.6, D-13). Same rollback set as `editacl_rollback(1)`,
# but carrying the complete `| editacl` invocation.
#
# The name says that it WRITES (`dryrun=f`). `editacl_rollback(1)` remains the preview
# form and the default entry point.
#
# The invocation no longer carries any field-naming parameter. That is the direct
# effect of the input contract rework: the macro emits the platform's native field
# names, and the four target values pick them up by default. The v1.3 class of error,
# an unquoted `fields` list truncated by SPL to its first value and a rollback that
# only restored `perms.read` while reporting a success, is eliminated **by
# construction**: there is no list left to quote.
#
# The ceiling is explicit. The default is ten (D-30), which would interrupt the
# rollback of a larger batch; a rollback covers a set already delimited by the `sid`,
# and the operator decided its volume at the time of the outbound pass.
#
# The definition delegates to `editacl_rollback(1)` rather than copying its SPL: two
# copies of the same pipeline would diverge at the first amendment, and the forgotten
# copy would be the one that writes.
[editacl_rollback_apply(1)]
args = sid
definition = `editacl_rollback($sid$)` \
| editacl dryrun=f max_objects=100000
description = APPLIED rollback of the execution identified by its `sid`: the rollback \
set of `editacl_rollback(<sid>)` followed by the complete | editacl invocation, in \
real write mode (dryrun=f) and with no effective ceiling. The four attributes are \
picked up implicitly, `eai:acl.owner` carrying the previous owner. Preview first with \
`editacl_rollback(<sid>)`.
iseval = 0

# Source of every shipped search that reads the journal or the diagnostic
# (specification sections 8.3.bis and 15.6, D-51). Two macros rather than the index and
# the sourcetype spelled out in each of the eleven panels of the monitoring view, for
# one reason that is not cosmetic: `default/inputs.conf` documents the redirection of
# the journal to a dedicated index as the single configuration point for retention. If
# the eleven panels each carried `index=_internal`, redirecting the index would
# silently empty the whole view.
#
# The cost is stated and not hidden: the deployment that redirects the index now has
# TWO files to override in `local/`, `inputs.conf` and `macros.conf`. That is one more
# than before, and still far fewer than eleven copies that would drift apart.
#
# NEITHER MACRO USES A SOURCETYPE WILDCARD, and that is the whole point of D-49. The
# diagnostic file produces seventeen auto-extracted business fields with no props.conf,
# among them `app`, `title`, `id`, `type` and `user` - homonyms of the journal fields
# and of INVERTED meaning: they carry a SPL FIELD NAME, not an object value. A
# `sourcetype=editacl:*` mixes the two sets without raising anything at all.

[acl_journal_source]
definition = index=_internal sourcetype=editacl:journal
description = Source of the editacl write-ahead journal. Override in local/macros.conf \
if inputs.conf has been changed to send the journal to a dedicated index.
iseval = 0

[acl_diag_source]
definition = index=_internal sourcetype=editacl:diag
description = Source of the editacl run diagnostic. Override in local/macros.conf if \
inputs.conf has been changed to send the diagnostic to a dedicated index.
iseval = 0

# ---------------------------------------------------------------------------
# Application-level macros (v4.1 sections 11.1 and 11.4).
#
# FIVE macros, and a source of their own. `editappacl` writes its own journal file with
# its own sourcetype (DV-3): a line of `editacl:journal` carries an OBJECT, a line of
# `editappacl:journal` carries a STANZA whose blast radius is several objects, and
# reading them through one macro would let a panel absorb one unit of account into the
# other.
#
# The cost is stated rather than hidden: redirecting the journal towards an index with a
# suitable retention now takes FOUR overrides instead of two - `local/inputs.conf` and
# `local/macros.conf`, for each of the two sets.
# ---------------------------------------------------------------------------

[app_acl_journal_source]
definition = index=_internal sourcetype=editappacl:journal
description = Source of the editappacl write-ahead journal. Override in \
local/macros.conf if inputs.conf has been changed to send the journal to a dedicated \
index.
iseval = 0

[app_acl_diag_source]
definition = index=_internal sourcetype=editappacl:diag
description = Source of the editappacl run diagnostic. Override in local/macros.conf if \
inputs.conf has been changed to send the diagnostic to a dedicated index.
iseval = 0

# Rollback set of one execution, as a PREVIEW (section 11.4).
#
# IT SELECTS ON REVERSIBILITY, NOT ON SUCCESS, and that is divergence DV-1 from the
# previous contract. Measured: a POST answering `403 Not removable` had written all the
# same, so "the return code was not 2xx" does NOT establish "nothing moved". The pairing
# therefore retains every target for which a POST WAS SENT, whatever it answered -
# `write_asserted` says `yes` on a 2xx and `unknown` on anything else after a POST, and
# `no` only when no POST left at all. Rewriting the prior state of a stanza that did not
# move is a `noop` by idempotence: the wider selection cannot hurt, the narrower one can
# miss a mutation.
#
# CREATIONS ARE EXCLUDED BY CONSTRUCTION, and this is the mechanism that closes the hole
# the previous project paid for. A created stanza has `reversible="false"` and empty
# `before_*` keys; the effective value it masked is kept under `inherited_*`, which this
# macro does not read. Re-injecting an inherited value would CREATE THE STANZA A SECOND
# TIME under cover of a restore. What the rollback does not cover is not silent either:
# `app_acl_irreversible(<sid>)` lists it.
#
# THE RESOLUTION RESTS ON `handler`, WHICH THE JOURNAL NEVER LEAVES EMPTY on a resolved
# family target - it is filled in at resolution time. That is the direct correction of
# the defect closed on 2026-08-10, where the macro re-emitted a type the journal often
# left empty and 515 objects were not restorable. `acl_stanza` is only the secondary
# route, and the restore therefore depends neither on a field that can be empty nor on
# the coverage of the family table.
#
# The `earliest(...) BY endpoint` is defense in depth against an aggregation that would
# mistakenly span several `sid` values. The time range of the calling search must cover
# the execution to be restored.
[app_acl_rollback(1)]
args = sid
definition = search `app_acl_journal_source` sid="$sid$" \
| eval _posted = if(phase="outcome" AND write_asserted!="no", 1, 0) \
| eventstats max(_posted) AS posted BY endpoint \
| search phase="intent" reversible="true" posted=1 \
| stats earliest(before_perms_read)  AS "eai:acl.perms.read", \
        earliest(before_perms_write) AS "eai:acl.perms.write", \
        earliest(before_sharing)     AS "eai:acl.sharing", \
        earliest(app)                AS "eai:acl.app", \
        earliest(stanza_kind)        AS acl_stanza_kind, \
        earliest(handler)            AS acl_handler, \
        earliest(stanza)             AS acl_stanza \
  BY endpoint \
| eval "eai:acl.perms.read"  = coalesce('eai:acl.perms.read',  ""), \
       "eai:acl.perms.write" = coalesce('eai:acl.perms.write', "") \
| fields "eai:acl.app" acl_stanza_kind acl_handler acl_stanza "eai:acl.perms.read" \
         "eai:acl.perms.write" "eai:acl.sharing"
description = Rollback set (preview) of the execution identified by its `sid`. It \
selects the REVERSIBLE targets, not the successful ones: a write may have happened \
despite an error return. Complete it with | editappacl dryrun=f allow_create=f, or use \
`app_acl_rollback_apply(<sid>)`. The stanzas CREATED by that execution are not in this \
set - nothing removes a generic stanza - and `app_acl_irreversible(<sid>)` lists them.
iseval = 0

# The `coalesce(..., "")` on the two permission columns is DEFENSE IN DEPTH, not the fix
# of an observed defect (v3.14 section 8.6, D-32). An ABSENT column preserves the
# attribute where an EMPTY one clears it, so a permission lost along the journalling
# chain would restore nothing while reporting a success. Measured on 9.4.6, the chain
# does not lose it; nothing obliges another version to keep that behavior.
#
# `eai:acl.sharing` is deliberately NOT treated the same way: an empty scope does not
# exist on the platform side, and materializing an empty column there would turn a
# correct preservation into a rejection. `acl_stanza` is left alone too, for the opposite
# reason - the empty string is its LEGITIMATE value on a `[]` target, and the kind of
# target is read from `acl_stanza_kind`, never from that field alone.

# APPLIED rollback (section 11.4). Same set as `app_acl_rollback(1)`, carrying the
# complete invocation. The name says that it WRITES.
#
# `allow_create=f` IS EXPLICIT AND NOT NEGOTIABLE: a restore never creates anything. If a
# target of the set turned out to be absent at replay time - it existed, it no longer
# does, a case no measured path produces - it comes out `rejected` rather than recreated.
#
# Both ceilings are raised explicitly. They default to 5 and 200, which would interrupt
# the restore of a larger batch; a rollback covers a set already delimited by the `sid`,
# and the operator decided its volume on the outbound leg. The VALUES are frozen by a
# test, not merely their presence: `max_stanzas=5` put back by hand would stop a restore
# at the sixth stanza, on the safety net of an irreversible operation, and report a
# success.
#
# The definition DELEGATES to `app_acl_rollback(1)` rather than copying its SPL: two
# copies of one pipeline diverge at the first amendment, and the forgotten copy would be
# the one that writes.
[app_acl_rollback_apply(1)]
args = sid
definition = `app_acl_rollback($sid$)` \
| editappacl dryrun=f allow_create=f max_stanzas=100000 max_impacted_objects=100000000
description = APPLIED rollback of the execution identified by its `sid`: the set of \
`app_acl_rollback(<sid>)` followed by the complete | editappacl invocation, in real \
write mode (dryrun=f), with creation refused and no effective ceiling. Preview first \
with `app_acl_rollback(<sid>)`.
iseval = 0

# WHAT THE ROLLBACK WILL NOT UNDO (section 9.4, dispositif 4, and section 11.4).
#
# Without this macro, "what my rollback does not cover" is visible NOWHERE - and that is
# exactly the dispositif that was missing from the previous project, where a rollback
# hole was found after delivery.
#
# It lists the targets that WERE WRITTEN and that the restore leaves behind: `reversible`
# valued `false` - a creation - or `unknown` - a write whose provenance could not be
# established. For each one it gives the value that was created (`after_*`) and the
# inherited value it masked (`inherited_*`), which is the only trace left of what the
# objects saw before.
#
# The selection on a POST having been sent is the same as in the rollback macro, and for
# the same measured reason: a non-2xx answer does not establish that nothing was written.
[app_acl_irreversible(1)]
args = sid
definition = search `app_acl_journal_source` sid="$sid$" \
| eval _posted = if(phase="outcome" AND write_asserted!="no", 1, 0) \
| eventstats max(_posted) AS posted BY endpoint \
| search phase="intent" posted=1 (reversible="false" OR reversible="unknown") \
| stats earliest(app)                   AS "eai:acl.app", \
        earliest(stanza_kind)           AS acl_stanza_kind, \
        earliest(stanza)                AS acl_stanza, \
        earliest(handler)               AS acl_handler, \
        earliest(reversible)            AS acl_reversible, \
        earliest(impacted_estimate)     AS acl_impacted_estimate, \
        earliest(after_perms_read)      AS acl_after_perms_read, \
        earliest(after_perms_write)     AS acl_after_perms_write, \
        earliest(after_sharing)         AS acl_after_sharing, \
        earliest(inherited_perms_read)  AS acl_inherited_perms_read, \
        earliest(inherited_perms_write) AS acl_inherited_perms_write, \
        earliest(inherited_sharing)     AS acl_inherited_sharing \
  BY endpoint \
| sort endpoint
description = Targets of the execution `sid` that WERE WRITTEN and that \
`app_acl_rollback(<sid>)` does not cover: the irreversible creations, and the writes \
whose provenance could not be established. Each row carries the value created \
(acl_after_*) and the inherited value it masked (acl_inherited_*). An empty result means \
the whole execution is restorable.
iseval = 0
