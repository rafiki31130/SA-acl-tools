# Implementation commune. Ne pas invoquer directement.
#
# Trois points de conception :
#
#  1. La selection est appliquee AVANT le `map`, donc une famille non demandee ne
#     coute aucun appel REST. Un operateur qui ne traite que des recherches
#     sauvegardees ne paie pas l'enumeration des fichiers de lookup (§6.7 contrainte 2).
#  2. L'argument est filtre par `replace` sur une liste blanche de caracteres avant
#     d'etre injecte dans une expression reguliere : le nom de famille est une entree
#     utilisateur, elle ne doit pas pouvoir alterer la regex.
#  3. `eai:type` est SYNTHETISE quand l'endpoint natif ne l'emet pas (§6.7
#     contrainte 4). La valeur retenue est la cle de la table correspondant a la
#     famille interrogee. Sans cette synthese l'aller fonctionnerait — `id` est
#     exploitable — mais le retour arriere serait impossible : `editacl_rollback`
#     resout par `eai:type`, `id` n'etant pas journalise. La valeur nativement emise,
#     quand il y en a une, est preservee telle quelle.
[acl_inventory_base(1)]
args = families
definition = inputlookup acl_object_families \
| eval acl_selection = replace("$families$", "[^A-Za-z0-9_,-]", "") \
| eval acl_family_re = if(acl_selection == "", ".*", "^(" . replace(acl_selection, ",", "|") . ")$") \
| where match(family, acl_family_re) \
| fields family, handler_path \
| map maxsearches=200 search="| rest splunk_server=local count=0 /servicesNS/-/-/$handler_path$ | eval acl_family=\"$family$\"" \
| eval "eai:type" = if(isnull('eai:type') OR 'eai:type' == "", acl_family, 'eai:type') \
| table title, "eai:acl.app", "eai:acl.owner", "eai:acl.perms.read", "eai:acl.perms.write", "eai:acl.sharing", "eai:type", id
description = Implementation commune de `acl_inventory` et `acl_inventory(1)`. \
Ne pas invoquer directement.
iseval = 0

# Jeu de restauration d'une execution (§8.6). Le SPL est celui du cahier des charges,
# a l'ajout pres du mot-cle `search` en tete — indispensable pour que la macro soit
# invocable en position generatrice (`| `editacl_rollback(<sid>)``).
#
# La macro ne restaure que les objets dont une ligne `outcome` atteste que l'ecriture
# a bien abouti : un objet dont le POST a echoue n'a pas ete modifie et ne doit pas
# etre « restaure » vers un etat qu'il n'a jamais quitte.
#
# Le `earliest(...) BY endpoint` est une defense en profondeur : la deduplication par
# URI exclut deja les doublons intra-execution, mais le tri explicite protege d'une
# agregation portant par erreur sur plusieurs `sid`.
#
# La plage temporelle de la recherche appelante doit couvrir l'execution a restaurer.
[editacl_rollback(1)]
args = sid
definition = search index=_internal sourcetype=editacl:journal sid="$sid$" \
| eval _restorable = if(phase="outcome" AND status="updated", 1, 0) \
| eventstats max(_restorable) AS restorable BY endpoint \
| search phase="intent" restorable=1 \
| stats earliest(before_perms_read)  AS "eai:acl.perms.read", \
        earliest(before_perms_write) AS "eai:acl.perms.write", \
        earliest(before_sharing)     AS "eai:acl.sharing", \
        earliest(before_owner)       AS "eai:acl.owner", \
        earliest(app)                AS "eai:acl.app", \
        earliest(title)              AS title, \
        earliest(eai_type)           AS "eai:type" \
  BY endpoint \
| eval "eai:acl.perms.read"  = coalesce('eai:acl.perms.read',  ""), \
       "eai:acl.perms.write" = coalesce('eai:acl.perms.write', "") \
| fields title "eai:acl.*" "eai:type"
description = Jeu de restauration (previsualisation) de l'execution identifiee par son \
`sid`. A completer par | editacl dryrun=f — aucun autre parametre : la macro emet les \
champs de nomenclature native, que les quatre valeurs cibles reprennent par defaut. \
`eai:acl.owner` porte le proprietaire ANTERIEUR, que le defaut de `new_owner` applique \
sans que rien n'ait a etre nomme. Pour ne pas dependre de cette saisie, utiliser \
`editacl_rollback_apply(<sid>)`.
iseval = 0

# Le `coalesce(..., "")` sur les deux colonnes de permissions n'est pas cosmetique.
#
# Le §8.6 exige que la restauration d'une permission VIDE soit correcte. Une permission
# vide est journalisee `before_perms_read = ""` ; a l'indexation, l'extraction JSON ne
# materialise pas un champ de valeur vide, et le `stats` ci-dessus ne produit alors
# AUCUNE colonne `eai:acl.perms.read` lorsque tous les objets du lot sont dans ce cas.
#
# Or la semantique de presence du §3.2 dit qu'une colonne absente PRESERVE l'attribut.
# Sans ce `coalesce`, une restauration devant vider `perms.read` le laisserait donc
# intact — en rapportant un succes. C'est exactement la classe de defaut que la refonte
# corrige ailleurs, et elle se reintroduirait ici par la porte de service.
#
# Le `coalesce` materialise la colonne inconditionnellement : elle existe toujours, vide
# quand l'etat anterieur l'etait, et la restauration vide alors l'attribut. La promesse
# du §8.6 redevient vraie PAR CONSTRUCTION, et non par coincidence.
#
# `eai:acl.sharing` et `eai:acl.owner` ne sont deliberement PAS traites de meme : leur
# valeur vide n'existe pas cote plateforme, un objet restaurable en porte toujours une,
# et materialiser une colonne vide ne ferait qu'y transformer une preservation correcte
# en rejet.

# Restauration APPLIQUEE (§8.6, D-13). Meme jeu de restauration que
# `editacl_rollback(1)`, mais portant l'invocation `| editacl` complete.
#
# Le nom dit qu'elle ECRIT (`dryrun=f`). `editacl_rollback(1)` reste la forme de
# previsualisation et la porte d'entree par defaut.
#
# L'invocation ne porte plus aucun parametre de nommage. C'est l'effet direct de la
# refonte du contrat d'entree : la macro emet les champs de nomenclature native, et les
# quatre valeurs cibles les reprennent par defaut. La classe d'erreur de la v1.3 — une
# liste `fields` non quotee, tronquee par SPL a sa premiere valeur, une restauration qui
# ne retablissait que `perms.read` en rapportant un succes — est eliminee **par
# construction** : il n'y a plus de liste a quoter.
#
# Le plafond est explicite. Le defaut vaut dix (D-30), ce qui interromprait la
# restauration d'un lot plus large ; une restauration porte sur un jeu deja delimite par
# le `sid`, dont l'operateur a decide le volume au moment de l'aller.
#
# La definition delegue a `editacl_rollback(1)` plutot que de recopier son SPL : deux
# copies du meme pipeline divergeraient au premier amendement, et la copie oubliee
# serait celle qui ecrit.
[editacl_rollback_apply(1)]
args = sid
definition = `editacl_rollback($sid$)` \
| editacl dryrun=f max_objects=100000
description = Restauration APPLIQUEE de l'execution identifiee par son `sid` : jeu de \
restauration de `editacl_rollback(<sid>)` suivi de l'invocation | editacl complete, en \
ecriture reelle (dryrun=f) et sans plafond effectif. Les quatre attributs sont repris \
implicitement, `eai:acl.owner` portant le proprietaire anterieur. Previsualiser d'abord \
avec `editacl_rollback(<sid>)`.
iseval = 0
