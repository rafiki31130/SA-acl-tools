# Shipped searches (specification section 12.7).
#
# The two inventory searches are built on the `acl_inventory` macro, NEVER on
# `| rest ... /admin/directory`: that handler only sees a fraction of the objects and
# emits neither lookup files nor data models.
#
# None of them is scheduled (`enableSched = 0`). That is deliberate: the inventory is
# a macro that can be invoked inline, and scheduling is a recommended usage on large
# scopes, never the access modality (section 6.7 constraint 1). An operator who wants
# a periodic execution turns scheduling on in `local/savedsearches.conf`.

[ACL - inventory by role]
description = Breakdown of the read and write permissions by role, application and \
object type, over the complete inventory. Starting point for an entitlement audit: \
which role grants access to what, and on how many objects.
search = | `acl_inventory` \
| rename "eai:acl.app" AS acl_app, "eai:type" AS acl_type, \
         "eai:acl.perms.read" AS acl_read, "eai:acl.perms.write" AS acl_write \
| eval acl_read  = coalesce(acl_read,  "(no role)") \
| eval acl_write = coalesce(acl_write, "(no role)") \
| eval acl_grant = mvappend(mvmap(acl_read,  "read="  . acl_read), \
                            mvmap(acl_write, "write=" . acl_write)) \
| fields acl_app, acl_type, acl_grant \
| mvexpand acl_grant \
| rex field=acl_grant "^(?<acl_access>read|write)=(?<acl_role>.*)$" \
| stats count AS objects BY acl_role, acl_access, acl_app, acl_type \
| sort - objects, acl_role, acl_access
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0
request.ui_dispatch_view = search

[ACL - references to decommissioned roles]
description = Objects whose ACL still references a role from the list carried by the \
`acl_decommissioned_roles` lookup. The output carries the input contract of `editacl` \
and therefore feeds the modification pipeline directly, with no intermediate \
transformation.
search = | `acl_inventory` \
| eval acl_role = mvdedup(mvappend('eai:acl.perms.read', 'eai:acl.perms.write')) \
| lookup acl_decommissioned_roles role AS acl_role OUTPUT role AS acl_role_decommissioned \
| where isnotnull(acl_role_decommissioned) \
| table title, "eai:acl.app", "eai:acl.owner", "eai:acl.perms.read", \
        "eai:acl.perms.write", "eai:acl.sharing", "eai:type", id, \
        acl_role_decommissioned
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0
request.ui_dispatch_view = search

[ACL - eventtype / derived object divergences]
description = Objects derived from an eventtype whose ACL diverges from that of their \
carrier object, and tracked roles that a derived object references without its \
carrier referencing them. This is exactly the scope that `editacl` never reaches: the \
command abstains from writing derived objects, and the cascade only aligns them when \
their carrier is itself written. A diverging derived object whose carrier enters no \
batch therefore keeps its references. This search makes that volume measurable; the \
treatment happens upstream, on the deployer side.
search = | `acl_inventory(eventtypes,fvtags)` \
| rex field=title "^(?<acl_pair_field>[^=]+)=(?<acl_pair_value>.*)$" \
| eval acl_side = case('eai:type'=="eventtypes", "carrier", \
                       'eai:type'=="fvtags" AND acl_pair_field=="eventtype", "derived") \
| where isnotnull(acl_side) \
| eval acl_carrier = if(acl_side=="derived", acl_pair_value, title) \
| eval acl_read  = if(isnull('eai:acl.perms.read'),  "", mvjoin(mvsort(mvdedup('eai:acl.perms.read')),  ",")) \
| eval acl_write = if(isnull('eai:acl.perms.write'), "", mvjoin(mvsort(mvdedup('eai:acl.perms.write')), ",")) \
| eval acl_fingerprint = coalesce('eai:acl.sharing',"") . " | read=" . acl_read . " | write=" . acl_write \
| eval acl_roles = mvdedup(mvappend('eai:acl.perms.read','eai:acl.perms.write')) \
| lookup acl_decommissioned_roles role AS acl_roles OUTPUT role AS acl_role_tracked \
| stats values(eval(if(acl_side=="carrier", acl_fingerprint,  null()))) AS acl_acl_carrier, \
        values(eval(if(acl_side=="derived", acl_fingerprint,  null()))) AS acl_acl_derived, \
        values(eval(if(acl_side=="derived", title,            null()))) AS acl_derived_object, \
        values(eval(if(acl_side=="carrier", acl_role_tracked, null()))) AS acl_roles_carrier, \
        values(eval(if(acl_side=="derived", acl_role_tracked, null()))) AS acl_roles_derived \
  BY "eai:acl.app", acl_carrier \
| where isnotnull(acl_acl_carrier) AND isnotnull(acl_acl_derived) \
| eval acl_carrier_list = "," . mvjoin(acl_roles_carrier, ",") . "," \
| eval acl_role_uncovered = mvmap(acl_roles_derived, \
      if(match(acl_carrier_list, "," . acl_roles_derived . ","), null(), acl_roles_derived)) \
| where acl_acl_carrier != acl_acl_derived OR isnotnull(acl_role_uncovered) \
| eval acl_finding = if(isnotnull(acl_role_uncovered), \
      "tracked role referenced by the derived object only", "diverging ACL") \
| table "eai:acl.app", acl_carrier, acl_derived_object, acl_acl_carrier, acl_acl_derived, \
        acl_role_uncovered, acl_finding \
| sort acl_finding, "eai:acl.app", acl_carrier
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0
request.ui_dispatch_view = search

[ACL - change journal]
description = History of the `editacl` executions, broken down by sid, status, \
application and object type. Entry point for rollback: the `rollback` column \
carries the command to replay for the execution concerned.
search = index=_internal sourcetype=editacl:journal phase=outcome \
| stats count AS events, earliest(ts) AS start, latest(ts) AS end, \
        values(user) AS operator \
  BY sid, status, app, eai_type \
| eval rollback = "| `" . "editacl_rollback(" . sid . ")" . "`" \
| sort - end, sid, status
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0
request.ui_dispatch_view = search
