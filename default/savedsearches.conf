# Recherches livrees (cahier des charges §12.7).
#
# Les deux recherches d'inventaire sont baties sur la macro `acl_inventory`, JAMAIS sur
# `| rest ... /admin/directory` : ce handler ne voit qu'une fraction des objets et
# n'emet ni fichier de lookup ni modele de donnees.
#
# Aucune n'est planifiee (`enableSched = 0`). C'est delibere : l'inventaire est une
# macro invocable en ligne, la planification est un usage recommande sur les gros
# perimetres, jamais la modalite d'acces (§6.7 contrainte 1). L'exploitant qui veut une
# execution periodique active la planification dans `local/savedsearches.conf`.

[ACL — inventaire par rôle]
description = Ventilation des permissions de lecture et d'ecriture par role, \
application et type d'objet, sur l'inventaire complet. Point de depart d'un audit \
d'habilitation : quel role donne acces a quoi, et sur combien d'objets.
search = | `acl_inventory` \
| rename "eai:acl.app" AS acl_app, "eai:type" AS acl_type, \
         "eai:acl.perms.read" AS acl_read, "eai:acl.perms.write" AS acl_write \
| eval acl_read  = coalesce(acl_read,  "(aucun role)") \
| eval acl_write = coalesce(acl_write, "(aucun role)") \
| eval acl_grant = mvappend(mvmap(acl_read,  "lecture="  . acl_read), \
                            mvmap(acl_write, "ecriture=" . acl_write)) \
| fields acl_app, acl_type, acl_grant \
| mvexpand acl_grant \
| rex field=acl_grant "^(?<acl_acces>lecture|ecriture)=(?<acl_role>.*)$" \
| stats count AS objets BY acl_role, acl_acces, acl_app, acl_type \
| sort - objets, acl_role, acl_acces
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0
request.ui_dispatch_view = search

[ACL — références aux rôles décommissionnés]
description = Objets dont l'ACL reference encore un role de la liste portee par le \
lookup `acl_decommissioned_roles`. La sortie porte le contrat d'entree de `editacl` \
et alimente donc directement le pipeline de modification, sans transformation \
intermediaire.
search = | `acl_inventory` \
| eval acl_role = mvdedup(mvappend('eai:acl.perms.read', 'eai:acl.perms.write')) \
| lookup acl_decommissioned_roles role AS acl_role OUTPUT role AS acl_role_decommissionne \
| where isnotnull(acl_role_decommissionne) \
| table title, "eai:acl.app", "eai:acl.owner", "eai:acl.perms.read", \
        "eai:acl.perms.write", "eai:acl.sharing", "eai:type", id, \
        acl_role_decommissionne
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0
request.ui_dispatch_view = search

[ACL — journal des modifications]
description = Historique des executions de `editacl`, ventile par sid, statut, \
application et type d'objet. Point d'entree de la restauration : la colonne \
`restauration` porte la commande a rejouer pour l'execution concernee.
search = index=_internal sourcetype=editacl:journal phase=outcome \
| stats count AS evenements, earliest(ts) AS debut, latest(ts) AS fin, \
        values(user) AS operateur \
  BY sid, status, app, eai_type \
| eval restauration = "| `" . "editacl_rollback(" . sid . ")" . "`" \
| sort - fin, sid, status
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 0
disabled = 0
alert.track = 0
request.ui_dispatch_view = search
