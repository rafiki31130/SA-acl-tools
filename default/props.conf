# Index-time and search-time treatment of the two files of section 8.1.
#
# The journal is JSON and says so. The diagnostic is FREE TEXT, and that is the whole
# difficulty of the stanza below.

[editacl:journal]
KV_MODE          = json
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIME_PREFIX      = \"ts\":\"
TIME_FORMAT      = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE         = 0

# Diagnostic file - `editacl.log`. Every line is
#
#     <ISO timestamp> <LEVEL> sid=<sid> <free text>
#
# and the free text is written by `bin/acltools/diag.py`, which copies platform error
# messages into it. It is not a key/value format and must not be read as one.
#
# `KV_MODE = none` IS THE FIX OF A MEASURED DEFECT, not a performance tweak.
#
# Without it the automatic extractor runs over the free text and invents fields out of
# whatever looks like `key=value`. MEASURED on 2 201 lines of a lab:
#
#   - `sid`, the key the monitoring view aggregates on, is polluted on 11 lines out of
#     2 201, on 11 of the 259 distinct values. On a line whose message carries no later
#     `key=value` sequence, the extractor swallows the whole sentence into the value:
#     one value measured at 144 characters. The view then renders TWO rows for ONE run,
#     and the row carrying the usable sid gets the WRONG cause - "killed before its
#     first write" instead of "fatal error", because the fatal text left with the ghost;
#   - `max_objects`, read by the same panel, is polluted the same way on 5 lines out of
#     241, with values such as `10 <reason the ceiling was reached>`;
#   - two fields exist that NO diagnostic line ever declared - `acl_status` (107 lines,
#     100 % of them carrying a sentence) and `fields` (53 lines). They are pure
#     artefacts of a message that happened to contain an equals sign.
#
# The same mechanism is what makes the seventeen business fields of D-49 homonyms of
# the journal fields. `KV_MODE = none` removes the class, not one instance of it.
#
# What the stanza gives back is declared explicitly below, and only that. An `EXTRACT-`
# is a SEARCH-TIME extraction: it applies to lines already indexed, so the fix is
# retroactive over the whole retention window - no re-indexing, no data loss.
#
# **These settings are search-time, so they only apply where they are EXPORTED.**
# MEASURED, and it is the trap of this fix: the same query run in the namespace of this
# app returns 248 clean sid values, and run in the namespace of `search` returns 259 with
# 11 polluted - the stanza simply does not apply there. `metadata/default.meta` therefore
# exports `props`, and `tests/test_dashboard.py` fails if that export is removed. The
# journal never depended on it: its JSON is picked up by the platform on its own, which
# is exactly what hid the problem.
#
# Two anchoring rules, and the second one was learned the expensive way:
#
#  1. `\S+` on `sid` is what closes the defect. A sid carries no space, so a sentence
#     can no longer be absorbed into it. A `.+` or a `[^=]+` here would reopen it.
#  2. **The expressions anchor on the SEQUENCE OF KEYS, never on the prose of the
#     message.** A first version anchored on the words `editacl startup` and
#     `parameters`; measured against a corpus written before the repository moved to
#     English, it extracted `user` on 19 lines out of 248. The prose of a diagnostic
#     message is precisely the thing that changes - a translation, a reworded warning -
#     and an extraction that depends on it loses its fields without a word. The key
#     sequence is the contract; the sentence around it is not.
#
# `level` is captured for the same reason, and it is worth stating why a severity has
# to be a field here rather than a word to look for in the text.
#
# The severity is written by `logging`, from the level `bin/acltools/diag.py` passes:
# `fatal()` emits at `CRITICAL` and nothing else does. That token is therefore the ONLY
# language-independent marker of a fatal run in the file, and the monitoring view uses
# it to attribute a cause. MEASURED on the lab corpus, whole retention: 19 lines carry
# `CRITICAL`, on 19 distinct runs; searching the English sentence `fatal error:` finds
# **1** of them. The other 18 predate the move to English and read `erreur fatale :`.
# A view that counted the sentence reported those 18 runs as "killed before their first
# write" - the right line, the wrong cause, which is the very defect this stanza was
# written to close, one level up.
#
# `journal_file` is captured for the same purpose: the second cause the view attributes
# is "the rollback journal could not be opened", and the only part of that message that
# does not change with the language is the FILE NAME, whose shape is a contract (D-3,
# and the monitor glob of `inputs.conf`). Severity plus file name identify the event
# without reading one word of prose.
[editacl:diag]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
KV_MODE          = none
EXTRACT-editacl_diag_run     = ^\S+\s+(?<level>[A-Z]+)\s+sid=(?<sid>\S+)
EXTRACT-editacl_diag_startup = \bversion=(?<version>\S+)\s+user=(?<user>\S+)\s
EXTRACT-editacl_diag_target  = \bsplunkd=(?<splunkd>\S+)\s+verify_ssl=(?<verify_ssl>\S+)
EXTRACT-editacl_diag_params  = \bdryrun=(?<dryrun>\S+)\s+validate_roles=(?<validate_roles>\S+)\s+journal=(?<journal>\S+)\s+max_objects=(?<max_objects>\S+)
EXTRACT-editacl_diag_journal = (?<journal_file>editacl_journal\S*\.log)

# Application-level journal - `editappacl_journal_<sid>.log` (v4.3 section 11.1, DV-3).
# Same treatment as the journal above, key for key: it is the same format, produced by
# the same builders, with `ts` first for the same hard reason - `TIME_PREFIX` and
# `MAX_TIMESTAMP_LOOKAHEAD` depend on it, and a `ts` pushed further into the line would
# fall outside the window, leaving the platform to timestamp the event with the ingestion
# time and saying nothing about it.
[editappacl:journal]
KV_MODE          = json
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIME_PREFIX      = \"ts\":\"
TIME_FORMAT      = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE         = 0

# Application-level diagnostic - `editappacl.log`. Same free-text format, same
# `KV_MODE = none` for the same measured reason, and the extractions anchor on the
# SEQUENCE OF KEYS rather than on the prose, which is the rule the previous stanza
# learned the expensive way.
#
# The parameter line differs from the one above, and that is why it needs an extraction
# of its own: this command has six functional parameters where the other has four, and
# among them the two that decide what an operator is about to do - `allow_create`, which
# authorizes an irreversible act, and `max_impacted_objects`, which bounds a blast radius
# rather than a number of rows.
[editappacl:diag]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
KV_MODE          = none
EXTRACT-editappacl_diag_run     = ^\S+\s+(?<level>[A-Z]+)\s+sid=(?<sid>\S+)
EXTRACT-editappacl_diag_startup = \bversion=(?<version>\S+)\s+user=(?<user>\S+)\s
EXTRACT-editappacl_diag_target  = \bsplunkd=(?<splunkd>\S+)\s+verify_ssl=(?<verify_ssl>\S+)
EXTRACT-editappacl_diag_params  = \bdryrun=(?<dryrun>\S+)\s+allow_create=(?<allow_create>\S+)\s+validate_roles=(?<validate_roles>\S+)\s+journal=(?<journal>\S+)\s+max_stanzas=(?<max_stanzas>\S+)\s+max_impacted_objects=(?<max_impacted_objects>\S+)
EXTRACT-editappacl_diag_journal = (?<journal_file>editappacl_journal\S*\.log)
