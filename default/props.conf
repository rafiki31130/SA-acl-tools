# Index-time and search-time treatment of the two files of section 8.1.
#
# The journal is JSON and says so. The diagnostic is FREE TEXT, and that is the whole
# difficulty of the stanza below.

[editacl:journal]
KV_MODE          = json
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIME_PREFIX      = \"ts\":\"
TIME_FORMAT      = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE         = 0

# Diagnostic file - `editacl.log`. Every line is
#
#     <ISO timestamp> <LEVEL> sid=<sid> <free text>
#
# and the free text is written by `bin/acltools/diag.py`, which copies platform error
# messages into it. It is not a key/value format and must not be read as one.
#
# `KV_MODE = none` IS THE FIX OF A MEASURED DEFECT, not a performance tweak.
#
# Without it the automatic extractor runs over the free text and invents fields out of
# whatever looks like `key=value`. MEASURED on 2 201 lines of a lab:
#
#   - `sid`, the key the monitoring view aggregates on, is polluted on 11 lines out of
#     2 201, on 11 of the 259 distinct values. On a line whose message carries no later
#     `key=value` sequence, the extractor swallows the whole sentence into the value:
#     one value measured at 144 characters. The view then renders TWO rows for ONE run,
#     and the row carrying the usable sid gets the WRONG cause - "killed before its
#     first write" instead of "fatal error", because the fatal text left with the ghost;
#   - `max_objects`, read by the same panel, is polluted the same way on 5 lines out of
#     241, with values such as `10 <reason the ceiling was reached>`;
#   - two fields exist that NO diagnostic line ever declared - `acl_status` (107 lines,
#     100 % of them carrying a sentence) and `fields` (53 lines). They are pure
#     artefacts of a message that happened to contain an equals sign.
#
# The same mechanism is what makes the seventeen business fields of D-49 homonyms of
# the journal fields. `KV_MODE = none` removes the class, not one instance of it.
#
# What the stanza gives back is declared explicitly below, and only that. An `EXTRACT-`
# is a SEARCH-TIME extraction: it applies to lines already indexed, so the fix is
# retroactive over the whole retention window - no re-indexing, no data loss.
#
# The three regular expressions are ANCHORED on the structure of the line, never on a
# free `key=value` sweep. `\S+` on `sid` is what closes the defect: a sid cannot contain
# a space, so the sentence can no longer be absorbed into it.
[editacl:diag]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
KV_MODE          = none
EXTRACT-editacl_diag_run     = ^\S+\s+[A-Z]+\s+sid=(?<sid>\S+)
EXTRACT-editacl_diag_startup = editacl startup version=(?<version>\S+) user=(?<user>\S+) splunkd=(?<splunkd>\S+) verify_ssl=(?<verify_ssl>\S+)
EXTRACT-editacl_diag_params  = parameters dryrun=(?<dryrun>\S+) validate_roles=(?<validate_roles>\S+) journal=(?<journal>\S+) max_objects=(?<max_objects>\S+)
